<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#090d16" />
  <title>Sambung Kata Nusantara LDR</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap');

    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    input {
      user-select: text;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #05070d;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #f8fafc;
    }

    .app-shell {
      width: 100%;
      max-width: 430px;
      height: 100dvh;
      margin: 0 auto;
      position: relative;
      display: flex;
      flex-direction: column;
      background: radial-gradient(circle at 50% 0%, #1e132c 0%, #0b0f19 55%, #070a12 100%);
      overflow: hidden;
    }

    @media (min-width: 480px) {
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #030408;
      }
      .app-shell {
        height: min(880px, 96dvh);
        border-radius: 36px;
        border: 1.5px solid rgba(255, 255, 255, 0.09);
        box-shadow: 0 25px 70px -15px rgba(0, 0, 0, 0.85), 0 0 40px rgba(244, 63, 94, 0.12);
      }
    }

    .safe-top {
      padding-top: max(14px, var(--sat));
    }

    .safe-bottom {
      padding-bottom: max(16px, var(--sab));
    }

    .glass-card {
      background: rgba(17, 24, 39, 0.72);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .glass-surface {
      background: rgba(30, 41, 59, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.07);
    }

    .tap-btn {
      transition: transform 0.12s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.15s ease;
    }
    .tap-btn:active:not(:disabled) {
      transform: scale(0.96);
    }
    .tap-btn:disabled {
      opacity: 0.45;
      pointer-events: none;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-7px); }
      40%, 80% { transform: translateX(7px); }
    }
    .animate-shake {
      animation: shake 0.35s ease-in-out;
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.9) translateY(8px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    .animate-pop {
      animation: popIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(0.8); }
      70% { opacity: 1; transform: translateY(-90px) scale(1.2); }
      100% { opacity: 0; transform: translateY(-130px) scale(1); }
    }
    .floating-emoji {
      position: absolute;
      bottom: 85px;
      pointer-events: none;
      font-size: 2rem;
      z-index: 45;
      animation: floatUp 1.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body>
  <div id="app" class="app-shell">
    <!-- Top Header -->
    <header class="safe-top px-4 pb-2.5 flex items-center justify-between z-20 shrink-0">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-2xl bg-gradient-to-br from-rose-500 to-pink-600 flex items-center justify-center shadow-lg shadow-rose-500/25">
          <svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
        </div>
        <div class="flex items-center gap-2">
          <span class="font-extrabold text-[15px] tracking-tight text-white">Sambung Kata</span>
          <span id="conn-dot" class="w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse" title="Status Koneksi"></span>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button id="btn-open-punishments" type="button" class="tap-btn px-2.5 py-1.5 rounded-xl glass-surface flex items-center gap-1.5 text-xs font-bold text-rose-300">
          <svg class="w-3.5 h-3.5 text-rose-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
            <rect x="3" y="8" width="18" height="13" rx="2"/><path d="M12 8v13"/><path d="M3 12h18"/><path d="M12 8H7.5a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8z"/><path d="M12 8h4.5a2.5 2.5 0 0 0 0-5C13 3 12 8 12 8z"/>
          </svg>
          <span id="punishment-count-badge">10</span>
        </button>

        <button id="btn-toggle-sound" type="button" class="tap-btn w-8 h-8 rounded-xl glass-surface flex items-center justify-center text-slate-300">
          <svg id="icon-sound-on" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
          </svg>
          <svg id="icon-sound-off" class="w-4 h-4 hidden text-slate-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="absolute top-16 left-4 right-4 z-50 flex flex-col items-center gap-1.5 pointer-events-none"></div>

    <!-- =================================================================== -->
    <!-- VIEW 1: LOBBY                                                       -->
    <!-- =================================================================== -->
    <section id="view-lobby" class="flex-1 flex flex-col justify-between px-5 pb-2 overflow-hidden">
      <div class="flex-1 flex flex-col justify-center gap-4">
        <!-- Language Pills -->
        <div class="flex items-center justify-center gap-1.5 flex-wrap">
          <span class="px-2.5 py-1 rounded-full text-[10px] font-extrabold tracking-wider bg-rose-500/15 text-rose-300 border border-rose-500/25">ID</span>
          <span class="px-2.5 py-1 rounded-full text-[10px] font-extrabold tracking-wider bg-amber-500/15 text-amber-300 border border-amber-500/25">JAWA</span>
          <span class="px-2.5 py-1 rounded-full text-[10px] font-extrabold tracking-wider bg-emerald-500/15 text-emerald-300 border border-emerald-500/25">SUNDA</span>
          <span class="px-2.5 py-1 rounded-full text-[10px] font-extrabold tracking-wider bg-sky-500/15 text-sky-300 border border-sky-500/25">LOKAL</span>
        </div>

        <!-- Main Card -->
        <div class="glass-card rounded-3xl p-4 space-y-3.5 shadow-2xl">
          <input id="input-player-name" type="text" maxlength="14" placeholder="Nama kamu..."
            class="w-full px-4 py-3.5 rounded-2xl bg-slate-950/80 border border-slate-800 text-white placeholder-slate-500 font-bold text-sm text-center focus:outline-none focus:border-rose-500 transition-colors" />

          <button id="btn-create-room" type="button"
            class="tap-btn w-full py-3.5 px-4 rounded-2xl bg-gradient-to-r from-rose-500 to-pink-600 text-white font-extrabold text-sm shadow-lg shadow-rose-600/25 flex items-center justify-center gap-2">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6">
              <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            Buat Room
          </button>

          <div class="flex items-center gap-2">
            <input id="input-room-code" type="text" maxlength="4" placeholder="K O D E"
              class="w-28 shrink-0 px-3 py-3.5 rounded-2xl bg-slate-950/80 border border-slate-800 text-white placeholder-slate-500 font-extrabold text-sm text-center uppercase tracking-[0.25em] focus:outline-none focus:border-sky-400 transition-colors" />
            <button id="btn-join-room" type="button"
              class="tap-btn flex-1 py-3.5 px-4 rounded-2xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white font-extrabold text-sm flex items-center justify-center gap-1.5">
              Masuk Room
            </button>
          </div>
        </div>
      </div>

      <!-- Bottom Action & Export Bar -->
      <div class="safe-bottom pt-2 space-y-2">
        <button id="btn-local-mode" type="button"
          class="tap-btn w-full py-3 px-4 rounded-2xl glass-surface text-slate-300 font-bold text-xs flex items-center justify-center gap-2">
          <svg class="w-4 h-4 text-amber-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <rect x="5" y="2" width="14" height="20" rx="3"/><line x1="12" y1="18" x2="12.01" y2="18"/>
          </svg>
          Pass & Play (1 HP)
        </button>

        <div id="export-tools-bar" class="flex gap-2">
          <button id="btn-copy-full-code" type="button"
            class="tap-btn flex-1 py-2.5 px-3 rounded-xl bg-slate-900/90 border border-slate-800 text-slate-400 hover:text-white font-bold text-[11px] flex items-center justify-center gap-1.5">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
            Copy Code
          </button>
          <button id="btn-download-html" type="button"
            class="tap-btn flex-1 py-2.5 px-3 rounded-xl bg-slate-900/90 border border-slate-800 text-slate-400 hover:text-white font-bold text-[11px] flex items-center justify-center gap-1.5">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            Save index.html
          </button>
        </div>
      </div>
    </section>

    <!-- =================================================================== -->
    <!-- VIEW 2: WAITING ROOM                                                -->
    <!-- =================================================================== -->
    <section id="view-waiting" class="hidden flex-1 flex flex-col justify-between px-5 pb-2 overflow-hidden">
      <div class="flex-1 flex flex-col justify-center gap-3.5">
        <!-- Room Code Card -->
        <div class="glass-card rounded-3xl p-4 text-center space-y-2">
          <span class="text-[11px] font-bold uppercase tracking-widest text-slate-400">Kode Room</span>
          <button id="btn-copy-code" type="button" class="tap-btn w-full py-2.5 px-4 rounded-2xl bg-slate-950/90 border border-rose-500/30 flex items-center justify-center gap-3">
            <span id="display-room-code" class="text-3xl font-black tracking-[0.3em] text-rose-400 pl-2">----</span>
            <svg class="w-4 h-4 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
          </button>
        </div>

        <!-- Players Slots -->
        <div class="grid grid-cols-2 gap-2.5">
          <div id="slot-p1" class="glass-card rounded-2xl p-3.5 flex flex-col items-center gap-1.5 border-rose-500/40">
            <div class="w-10 h-10 rounded-full bg-rose-500/20 text-rose-300 font-black flex items-center justify-center text-sm">P1</div>
            <span id="waiting-p1-name" class="font-bold text-xs text-white truncate max-w-full">Pemain 1</span>
            <span class="text-[10px] font-bold text-emerald-400">Siap</span>
          </div>

          <div id="slot-p2" class="glass-card rounded-2xl p-3.5 flex flex-col items-center gap-1.5">
            <div class="w-10 h-10 rounded-full bg-slate-800 text-slate-400 font-black flex items-center justify-center text-sm">P2</div>
            <span id="waiting-p2-name" class="font-bold text-xs text-slate-400 truncate max-w-full">Menunggu...</span>
            <span id="waiting-p2-status" class="text-[10px] font-bold text-amber-400">Menunggu</span>
          </div>
        </div>

        <!-- Host Settings -->
        <div id="host-settings-box" class="glass-card rounded-3xl p-3.5 space-y-3">
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-slate-300">Waktu</span>
            <div class="flex gap-1.5">
              <button type="button" data-time="10" class="opt-time tap-btn px-2.5 py-1 rounded-lg text-xs font-extrabold bg-slate-800 text-slate-400">10d</button>
              <button type="button" data-time="15" class="opt-time tap-btn px-2.5 py-1 rounded-lg text-xs font-extrabold bg-rose-500 text-white">15d</button>
              <button type="button" data-time="20" class="opt-time tap-btn px-2.5 py-1 rounded-lg text-xs font-extrabold bg-slate-800 text-slate-400">20d</button>
              <button type="button" data-time="30" class="opt-time tap-btn px-2.5 py-1 rounded-lg text-xs font-extrabold bg-slate-800 text-slate-400">30d</button>
            </div>
          </div>

          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-slate-300">Nyawa</span>
            <div class="flex gap-1.5">
              <button type="button" data-lives="3" class="opt-lives tap-btn px-3 py-1 rounded-lg text-xs font-extrabold bg-rose-500 text-white">3 ❤️</button>
              <button type="button" data-lives="5" class="opt-lives tap-btn px-3 py-1 rounded-lg text-xs font-extrabold bg-slate-800 text-slate-400">5 ❤️</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Waiting Actions -->
      <div class="safe-bottom pt-2 flex gap-2.5">
        <button id="btn-leave-waiting" type="button"
          class="tap-btn px-4 py-3.5 rounded-2xl glass-surface text-slate-300 font-bold text-xs">
          Batal
        </button>
        <button id="btn-start-match" type="button" disabled
          class="tap-btn flex-1 py-3.5 px-4 rounded-2xl bg-gradient-to-r from-rose-500 to-pink-600 text-white font-extrabold text-sm shadow-lg shadow-rose-600/25">
          Mulai Main
        </button>
      </div>
    </section>

    <!-- =================================================================== -->
    <!-- VIEW 3: GAME ARENA                                                  -->
    <!-- =================================================================== -->
    <section id="view-game" class="hidden flex-1 flex flex-col justify-between px-4 pb-2 overflow-hidden">
      <!-- Players Scoreboard & Timer -->
      <div class="space-y-2.5 shrink-0">
        <div class="grid grid-cols-2 gap-2">
          <!-- P1 Pill -->
          <div id="hud-p1" class="glass-card rounded-2xl p-2.5 flex items-center justify-between border-rose-500/50 transition-all">
            <div class="min-w-0">
              <div id="hud-p1-name" class="text-xs font-extrabold text-white truncate">P1</div>
              <div id="hud-p1-lives" class="text-[11px] tracking-tighter mt-0.5">❤️❤️❤️</div>
            </div>
            <span id="hud-p1-badge" class="w-2.5 h-2.5 rounded-full bg-rose-500 shrink-0"></span>
          </div>

          <!-- P2 Pill -->
          <div id="hud-p2" class="glass-card rounded-2xl p-2.5 flex items-center justify-between opacity-60 transition-all">
            <div class="min-w-0">
              <div id="hud-p2-name" class="text-xs font-extrabold text-white truncate">P2</div>
              <div id="hud-p2-lives" class="text-[11px] tracking-tighter mt-0.5">❤️❤️❤️</div>
            </div>
            <span id="hud-p2-badge" class="w-2.5 h-2.5 rounded-full bg-slate-600 shrink-0"></span>
          </div>
        </div>

        <!-- Timer Bar -->
        <div class="flex items-center gap-2.5">
          <div class="flex-1 h-2.5 rounded-full bg-slate-900 overflow-hidden border border-slate-800">
            <div id="timer-bar" class="h-full bg-gradient-to-r from-emerald-400 to-teal-400 transition-all duration-200" style="width: 100%"></div>
          </div>
          <span id="timer-text" class="text-xs font-black tabular-nums text-slate-200 w-7 text-right">15s</span>
        </div>
      </div>

      <!-- Center Word Display & Chain History -->
      <div class="flex-1 flex flex-col justify-center items-center my-2 min-h-0">
        <!-- Word Chain Strip -->
        <div id="word-chain-list" class="w-full flex items-center gap-1.5 overflow-x-auto no-scrollbar py-1.5 px-1 mb-2"></div>

        <!-- Active Target Word Card -->
        <div id="word-card" class="w-full glass-card rounded-3xl p-5 text-center space-y-2 relative overflow-hidden">
          <div class="flex items-center justify-center gap-1.5">
            <span id="turn-indicator" class="px-3 py-1 rounded-full text-[11px] font-extrabold bg-rose-500/20 text-rose-300 border border-rose-500/30">
              Giliranmu
            </span>
          </div>

          <div class="py-1 flex items-baseline justify-center flex-wrap text-3xl sm:text-4xl font-black tracking-wide uppercase">
            <span id="word-prefix" class="text-slate-300">ANG</span><span id="word-target-syllable" class="text-rose-400 underline decoration-rose-500/60 decoration-4 underline-offset-4">SA</span>
          </div>

          <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-xl bg-slate-950/75 border border-slate-800">
            <span class="text-[11px] font-bold text-slate-400">Awalan:</span>
            <span id="required-prefix-badge" class="text-sm font-black uppercase text-amber-400 tracking-wider">SA</span>
          </div>
        </div>
      </div>

      <!-- Bottom Input & Reactions -->
      <div class="safe-bottom space-y-2 shrink-0">
        <!-- Quick Reactions -->
        <div class="flex items-center justify-between gap-1.5 px-1">
          <div class="flex items-center gap-1.5">
            <button type="button" data-emoji="❤️" class="emoji-btn tap-btn w-9 h-9 rounded-xl glass-surface text-base flex items-center justify-center">❤️</button>
            <button type="button" data-emoji="😂" class="emoji-btn tap-btn w-9 h-9 rounded-xl glass-surface text-base flex items-center justify-center">😂</button>
            <button type="button" data-emoji="😱" class="emoji-btn tap-btn w-9 h-9 rounded-xl glass-surface text-base flex items-center justify-center">😱</button>
            <button type="button" data-emoji="🔥" class="emoji-btn tap-btn w-9 h-9 rounded-xl glass-surface text-base flex items-center justify-center">🔥</button>
          </div>

          <button id="btn-quit-game" type="button" class="tap-btn px-3 h-9 rounded-xl glass-surface text-[11px] font-bold text-slate-400">
            Keluar
          </button>
        </div>

        <!-- Word Input Form -->
        <form id="form-word" class="flex gap-2">
          <input id="input-word" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
            placeholder="Ketik kata..."
            class="flex-1 min-w-0 px-4 py-3.5 rounded-2xl bg-slate-950/90 border border-slate-700 text-white placeholder-slate-500 font-extrabold text-base uppercase tracking-wider focus:outline-none focus:border-rose-500 transition-colors" />
          <button id="btn-submit-word" type="submit"
            class="tap-btn px-5 py-3.5 rounded-2xl bg-gradient-to-r from-rose-500 to-pink-600 text-white font-black text-sm shadow-lg shadow-rose-600/25 shrink-0 flex items-center justify-center">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6">
              <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </form>
      </div>
    </section>

    <!-- =================================================================== -->
    <!-- VIEW 4: GAME OVER & LDR PUNISHMENT                                  -->
    <!-- =================================================================== -->
    <section id="view-gameover" class="hidden flex-1 flex flex-col justify-between px-5 pb-2 overflow-hidden">
      <div class="flex-1 flex flex-col justify-center gap-4">
        <div class="text-center space-y-1">
          <div class="inline-flex items-center justify-center w-14 h-14 rounded-3xl bg-amber-500/20 border border-amber-500/30 text-3xl mb-1">🏆</div>
          <h2 id="winner-title" class="text-2xl font-black text-white">Pemenang</h2>
          <p id="loser-subtitle" class="text-xs font-bold text-rose-400">Hukuman untuk yang kalah</p>
        </div>

        <!-- Punishment Card -->
        <div class="glass-card rounded-3xl p-5 border-rose-500/40 text-center space-y-3 relative overflow-hidden">
          <span class="inline-block px-3 py-1 rounded-full text-[10px] font-extrabold uppercase tracking-widest bg-rose-500/20 text-rose-300">
            Kartu Hukuman LDR
          </span>
          <p id="punishment-result-text" class="text-base font-extrabold text-white leading-relaxed min-h-[3.5rem] flex items-center justify-center">
            ...
          </p>
          <button id="btn-reroll-punishment" type="button"
            class="tap-btn mx-auto px-3.5 py-1.5 rounded-xl bg-slate-800/90 border border-slate-700 text-xs font-bold text-amber-300 flex items-center gap-1.5">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
              <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
            </svg>
            Acak Lagi
          </button>
        </div>
      </div>

      <div class="safe-bottom pt-2 flex gap-2.5">

    // =========================================================================
    // 3. SYLLABIFIER & WORD VALIDATOR (ANTI-FOREIGN, 100% NUSANTARA)
    // =========================================================================
    const VOWELS = new Set(['a', 'e', 'i', 'o', 'u']);
    const DIGRAPHS = ['ng', 'ny', 'kh', 'sy'];

    function splitIndonesianSyllables(word) {
      const clean = word.toLowerCase().replace(/[^a-z]/g, '');
      if (!clean) return [];
      if (clean.length <= 2) return [clean];

      const tokens = [];
      let i = 0;
      while (i < clean.length) {
        const pair = clean.slice(i, i + 2);
        if (DIGRAPHS.includes(pair)) {
          tokens.push(pair);
          i += 2;
        } else {
          tokens.push(clean[i]);
          i += 1;
        }
      }

      const isVowel = (t) => t && t.length === 1 && VOWELS.has(t);
      const syllables = [];
      let current = '';

      for (let idx = 0; idx < tokens.length; idx++) {
        const tok = tokens[idx];
        current += tok;

        if (isVowel(tok)) {
          const next1 = tokens[idx + 1];
          const next2 = tokens[idx + 2];

          if (!next1) {
            syllables.push(current);
            current = '';
          } else if (isVowel(next1)) {
            syllables.push(current);
            current = '';
          } else {
            if (!next2) {
              current += next1;
              idx++;
              syllables.push(current);
              current = '';
            } else if (isVowel(next2)) {
              syllables.push(current);
              current = '';
            } else {
              current += next1;
              idx++;
              syllables.push(current);
              current = '';
            }
          }
        }
      }

      if (current) {
        if (syllables.length > 0 && ![...current].some(c => VOWELS.has(c))) {
          syllables[syllables.length - 1] += current;
        } else {
          syllables.push(current);
        }
      }

      return syllables;
    }

    function getTargetSyllable(word) {
      const syl = splitIndonesianSyllables(word);
      if (syl.length === 0) return word.slice(-2).toLowerCase();
      const last = syl[syl.length - 1];
      if (last.length === 1 && syl.length > 1) {
        return syl[syl.length - 2] + last;
      }
      return last;
    }

    function getWordDisplayParts(word) {
      const clean = word.toUpperCase();
      const target = getTargetSyllable(clean).toUpperCase();
      if (clean.endsWith(target) && clean.length > target.length) {
        return {
          prefix: clean.slice(0, clean.length - target.length),
          target: target
        };
      }
      return { prefix: '', target: clean };
    }

    const validationCache = new Map();

    function looksLikeForeignOrGibberish(word) {
      const w = word.toLowerCase();
      if (w.length < 2) return true;
      if (!/[aeiou]/.test(w)) return true;
      if (/[qvx]/.test(w)) return true;
      if (/(.)\1\1/.test(w)) return true;
      if (/(th|sh|ch|wh|ph|ck|gh|oo|ee|ea|tion|sion|ment|ing$|ed$|ly$|ness$)/.test(w)) {
        if (!NUSANTARA_LEXICON.has(w)) return true;
      }
      const commonEnglish = new Set([
        "love","you","me","she","he","they","we","the","and","for","are","but","not","all","any","can","had","her","was","one","our","out","day","get","has","him","his","how","man","new","now","old","see","two","way","who","boy","did","its","let","put","say","too","use","apple","banana","cat","dog","fish","bird","house","home","car","bike","book","pen","water","food","eat","drink","sleep","run","walk","good","bad","happy","sad","big","small","hot","cold","red","blue","green","black","white","yellow","pink","orange","purple","brown","game","play","word","time","life","world","heart","mind","soul","star","moon","sun","rain","wind","fire","earth","sky","sea","tree","flower"
      ]);
      if (commonEnglish.has(w)) return true;
      return false;
    }

    async function checkWiktionarySite(domain, word) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 1400);
      try {
        const url = `https://${domain}/w/api.php?action=query&titles=${encodeURIComponent(word)}&format=json&origin=*`;
        const res = await fetch(url, { signal: controller.signal });
        clearTimeout(timer);
        if (!res.ok) return false;
        const data = await res.json();
        const pages = data?.query?.pages;
        if (!pages) return false;
        return !Object.prototype.hasOwnProperty.call(pages, '-1');
      } catch (e) {
        clearTimeout(timer);
        return false;
      }
    }

    async function validateNusantaraWord(rawWord) {
      const word = rawWord.toLowerCase().trim();
      if (!/^[a-z]+$/.test(word) || word.length < 2) return false;
      if (NUSANTARA_LEXICON.has(word)) return true;
      if (validationCache.has(word)) return validationCache.get(word);
      if (looksLikeForeignOrGibberish(word)) {
        validationCache.set(word, false);
        return false;
      }

      const checks = await Promise.all([
        checkWiktionarySite('id.wiktionary.org', word),
        checkWiktionarySite('jv.wiktionary.org', word),
        checkWiktionarySite('su.wiktionary.org', word)
      ]);

      const found = checks.some(Boolean);
      validationCache.set(word, found);
      return found;
    }

    // =========================================================================
    class SoundFX {
      constructor() {
        this.enabled = true;
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) this.ctx = new AC();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
      }
      tone(freq, type, duration, vol = 0.12, delay = 0) {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime + delay;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(vol, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + duration);
      }
      pop() { this.tone(520, 'sine', 0.08, 0.1); }
      success() {
        this.tone(587.33, 'triangle', 0.12, 0.14, 0);
        this.tone(880, 'triangle', 0.2, 0.14, 0.09);
      }
      error() {
        this.tone(190, 'sawtooth', 0.16, 0.12, 0);
        this.tone(145, 'sawtooth', 0.22, 0.12, 0.11);
      }
      tick() { this.tone(920, 'sine', 0.05, 0.07); }
      win() {
        [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
          this.tone(f, 'triangle', 0.24, 0.15, i * 0.1);
        });
      }
    }
    const sfx = new SoundFX();

    // =========================================================================
    // 5. HTTPS PORT-443 REAL-TIME ENGINE (SSE + INSTANT REPLAY + POLLING)
    // =========================================================================
    const RELAY_BASE = 'https://ntfy.sh';
    const TOPIC_PREFIX = 'sk_ldr_id_2026_';

    let activeTopic = '';
    let sseSource = null;
    let pollInterval = null;
    let lastMsgTime = 0;
    const processedMsgIds = new Set();

    const state = {
      view: 'lobby',
      mode: 'online', // 'online' | 'local'
      roomCode: '',
      playerRole: 'p1', // 'p1' | 'p2'
      myName: '',
      settings: {
        turnTime: 15,
        maxLives: 3
      },
      roomState: null,
      fullUsedWords: [],
      timerInterval: null,
      timeLeft: 15,
      isValidating: false
    };

    function showToast(msg, type = 'info') {
      const container = document.getElementById('toast-container');
      const el = document.createElement('div');
      const colors = {
        info: 'bg-slate-900/95 border-slate-700 text-slate-100',
        success: 'bg-emerald-950/95 border-emerald-500/50 text-emerald-200',
        error: 'bg-rose-950/95 border-rose-500/50 text-rose-200'
      };
      el.className = `px-3.5 py-2 rounded-2xl border text-xs font-extrabold shadow-xl animate-pop ${colors[type] || colors.info}`;
      el.textContent = msg;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transition = 'opacity 0.2s ease';
        setTimeout(() => el.remove(), 220);
      }, 2200);
    }

    function switchView(viewName) {
      state.view = viewName;
      ['lobby', 'waiting', 'game', 'gameover'].forEach(v => {
        const sec = document.getElementById(`view-${v}`);
        if (sec) sec.classList.toggle('hidden', v !== viewName);
      });
    }

    function updateConnIndicator(connected) {
      const dot = document.getElementById('conn-dot');
      if (!dot) return;
      if (connected) {
        dot.className = 'w-2.5 h-2.5 rounded-full bg-emerald-400 shadow-sm shadow-emerald-400/50';
      } else {
        dot.className = 'w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse';
      }
    }

    async function checkRelayHealth() {
      try {
        const res = await fetch(`${RELAY_BASE}/v1/health`, { cache: 'no-store' });
        updateConnIndicator(res.ok);
      } catch (e) {
        updateConnIndicator(false);
      }
    }

    function stopRoomSync() {
      if (sseSource) {
        try { sseSource.close(); } catch (e) {}
        sseSource = null;
      }
      if (pollInterval) {
        clearInterval(pollInterval);
        pollInterval = null;
      }
      activeTopic = '';
      processedMsgIds.clear();
      lastMsgTime = 0;
    }

    async function publishPacket(topic, packet) {
      if (!topic) return false;
      try {
        const res = await fetch(`${RELAY_BASE}/${topic}`, {
          method: 'POST',
          body: JSON.stringify(packet)
        });
        if (res.ok) updateConnIndicator(true);
        return res.ok;
      } catch (e) {
        updateConnIndicator(false);
        return false;
      }
    }

    function handleRelayEnvelope(env) {
      if (!env || env.event !== 'message' || !env.id || !env.message) return;
      if (processedMsgIds.has(env.id)) return;
      processedMsgIds.add(env.id);
      if (env.time && env.time > lastMsgTime) {
        lastMsgTime = env.time;
      }

      let packet;
      try {
        packet = JSON.parse(env.message);
      } catch (e) {
        return;
      }
      if (!packet || !packet.kind) return;

      if (packet.kind === 'STATE' && packet.state) {
        handleIncomingRoomState(packet.state);
      } else if (packet.kind === 'EVENT' && packet.event) {
        handleIncomingRoomEvent(packet.event);
      }
    }

    async function pollRoomMessages(topic, sinceParam = 'all') {
      if (!topic || topic !== activeTopic) return false;
      try {
        const res = await fetch(`${RELAY_BASE}/${topic}/json?poll=1&since=${encodeURIComponent(sinceParam)}`, {
          cache: 'no-store'
        });
        if (!res.ok) return false;
        updateConnIndicator(true);
        const text = await res.text();
        if (!text.trim()) return false;
        let gotAny = false;
        const lines = text.trim().split('\n');
        for (const line of lines) {
          if (!line.trim()) continue;
          try {
            const env = JSON.parse(line);
            if (env.event === 'message') {
              gotAny = true;
              handleRelayEnvelope(env);
            }
          } catch (e) {}
        }
        return gotAny;
      } catch (e) {
        return false;
      }
    }

    function startRoomSync(code, replayAll = false) {
      stopRoomSync();
      const topic = `${TOPIC_PREFIX}${code}`;
      activeTopic = topic;
      const since = replayAll ? 'all' : '10s';

      try {
        sseSource = new EventSource(`${RELAY_BASE}/${topic}/sse?since=${since}`);
        sseSource.onopen = () => updateConnIndicator(true);
        sseSource.onmessage = (e) => {
          try {
            const env = JSON.parse(e.data);
            handleRelayEnvelope(env);
          } catch (err) {}
        };
      } catch (e) {}

      // Backup HTTP poll every 1.4s guarantees zero missed packets on any mobile network
      pollInterval = setInterval(() => {
        if (!activeTopic) return;
        const pollSince = lastMsgTime > 0 ? String(Math.max(0, lastMsgTime - 2)) : since;
        pollRoomMessages(activeTopic, pollSince);
      }, 1400);
    }

    function broadcastRoomState() {
      if (state.mode !== 'online' || !activeTopic || !state.roomState) return;
      const compactState = {
        ...state.roomState,
        usedWords: state.roomState.usedWords.slice(-12),
        updatedAt: Date.now()
      };
      publishPacket(activeTopic, { kind: 'STATE', state: compactState });
    }

    function sendRoomEvent(evt) {
      if (state.mode !== 'online' || !activeTopic) return;
      publishPacket(activeTopic, {
        kind: 'EVENT',
        event: { ...evt, sender: state.playerRole, ts: Date.now() }
      });
    }

    function generateRoomCode() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let code = '';
      for (let i = 0; i < 4; i++) {
        code += chars[Math.floor(Math.random() * chars.length)];
      }
      return code;
    }

    function getMyPlayerName() {
      const val = document.getElementById('input-player-name').value.trim();
      return val || (state.playerRole === 'p1' ? 'Sayang 1' : 'Sayang 2');
    }

    async function createOnlineRoom() {
      sfx.pop();
      state.mode = 'online';
      state.playerRole = 'p1';
      state.myName = getMyPlayerName();
      state.roomCode = generateRoomCode();
      state.fullUsedWords = ['angsa'];

      state.roomState = {
        code: state.roomCode,
        status: 'waiting',
        settings: { ...state.settings },
        p1: { name: state.myName, lives: state.settings.maxLives, joined: true },
        p2: { name: '', lives: state.settings.maxLives, joined: false },
        turn: 'p1',
        currentWord: 'angsa',
        usedWords: ['angsa'],
        winner: null,
        punishment: '',
        updatedAt: Date.now()
      };

      startRoomSync(state.roomCode, false);
      renderWaitingRoom();
      switchView('waiting');

      const ok = await publishPacket(activeTopic, { kind: 'STATE', state: state.roomState });
      if (!ok) {
        showToast('Cek koneksi internet kamu', 'error');
      }
    }

    async function joinOnlineRoom() {
      const code = document.getElementById('input-room-code').value.trim().toUpperCase();
      if (code.length !== 4) {
        showToast('Masukkan 4 karakter kode room', 'error');
        sfx.error();
        return;
      }

      sfx.pop();
      state.mode = 'online';
      state.playerRole = 'p2';
      state.myName = getMyPlayerName();
      state.roomCode = code;
      state.roomState = null;

      const btnJoin = document.getElementById('btn-join-room');
      btnJoin.disabled = true;
      btnJoin.textContent = 'Mencari...';

      startRoomSync(code, true);

      // Immediately poll cached messages for this room
      await pollRoomMessages(activeTopic, 'all');

      if (state.roomState && state.roomState.code === code) {
        btnJoin.disabled = false;
        btnJoin.textContent = 'Masuk Room';
        sendRoomEvent({ type: 'JOIN_REQUEST', name: state.myName });
        renderWaitingRoom();
        switchView('waiting');
        return;
      }

      // Retry quick checks up to 7 seconds in case host just created it
      let tries = 0;
      const waitCheck = setInterval(async () => {
        tries++;
        if (state.roomState && state.roomState.code === code) {
          clearInterval(waitCheck);
          btnJoin.disabled = false;
          btnJoin.textContent = 'Masuk Room';
          sendRoomEvent({ type: 'JOIN_REQUEST', name: state.myName });
          renderWaitingRoom();
          switchView('waiting');
          return;
        }
        await pollRoomMessages(activeTopic, 'all');
        if (tries >= 7) {
          clearInterval(waitCheck);
          btnJoin.disabled = false;
          btnJoin.textContent = 'Masuk Room';
          stopRoomSync();
          showToast('Room tidak ditemukan', 'error');
          sfx.error();
        }
      }, 1000);
    }

    function handleIncomingRoomEvent(evt) {
      if (!evt || evt.sender === state.playerRole) return;

      if (evt.type === 'JOIN_REQUEST' && state.playerRole === 'p1' && state.roomState) {
        const isNewJoin = !state.roomState.p2.joined || state.roomState.p2.name !== evt.name;
        state.roomState.p2 = {
          name: evt.name || 'Sayang 2',
          lives: state.roomState.settings.maxLives,
          joined: true
        };
        broadcastRoomState();
        if (isNewJoin) {
          sfx.success();
          showToast(`${state.roomState.p2.name} bergabung!`, 'success');
          if (state.view === 'waiting') renderWaitingRoom();
        }
      } else if (evt.type === 'PLAYER_LEFT') {
        showToast('Pasangan keluar dari room', 'error');
        sfx.error();
        if (state.playerRole === 'p1' && state.roomState) {
          state.roomState.p2 = { name: '', lives: state.roomState.settings.maxLives, joined: false };
          state.roomState.status = 'waiting';
          stopTurnTimer();
          broadcastRoomState();
          renderWaitingRoom();
          switchView('waiting');
        } else {
          leaveToLobby(false);
        }
      } else if (evt.type === 'REACTION') {
        spawnFloatingEmoji(evt.emoji);
        sfx.pop();
      } else if (evt.type === 'SUBMIT_WORD' && state.playerRole === 'p1' && state.roomState) {
        if (state.roomState.status === 'playing' && state.roomState.turn === 'p2') {
          applyAcceptedWord(evt.word);
        }
      } else if (evt.type === 'TIMEOUT' && state.playerRole === 'p1' && state.roomState) {
        if (state.roomState.status === 'playing' && state.roomState.turn === 'p2') {
          handlePlayerTimeout('p2');
        }
      }
    }

    function handleIncomingRoomState(incoming) {
      if (!incoming || incoming.code !== state.roomCode) return;

      if (state.playerRole === 'p2') {
        const prevStatus = state.roomState?.status;
        const prevWord = state.roomState?.currentWord;
        const prevTurn = state.roomState?.turn;

        state.roomState = incoming;
        if (Array.isArray(incoming.usedWords)) {
          for (const w of incoming.usedWords) {
            if (!state.fullUsedWords.includes(w)) state.fullUsedWords.push(w);
          }
        }

        if (!incoming.p2 || !incoming.p2.joined || incoming.p2.name !== state.myName) {
          sendRoomEvent({ type: 'JOIN_REQUEST', name: state.myName });
        }

        if (incoming.status === 'waiting') {
          renderWaitingRoom();
          if (state.view !== 'waiting') switchView('waiting');
        } else if (incoming.status === 'playing') {
          if (state.view !== 'game') {
            switchView('game');
          }
          if (prevWord && prevWord !== incoming.currentWord) {
            sfx.success();
          }
          renderGameArena();
          if (prevStatus !== 'playing' || prevTurn !== incoming.turn || prevWord !== incoming.currentWord) {
            startTurnTimer();
          }
        } else if (incoming.status === 'gameover') {
          stopTurnTimer();
          renderGameOver();
          if (state.view !== 'gameover') {
            sfx.win();
            switchView('gameover');
          }
        }
      }
    }

    // =========================================================================
    // 6. LOCAL PASS & PLAY MODE
    // =========================================================================
    function startLocalMode() {
      sfx.pop();
      state.mode = 'local';
      state.playerRole = 'p1';
      const p1Name = document.getElementById('input-player-name').value.trim() || 'Pemain 1';
      const starter = STARTER_WORDS[Math.floor(Math.random() * STARTER_WORDS.length)];
      state.fullUsedWords = [starter];

      state.roomState = {
        code: 'LOKAL',
        status: 'playing',
        settings: { ...state.settings },
        p1: { name: p1Name, lives: state.settings.maxLives, joined: true },
        p2: { name: 'Pemain 2', lives: state.settings.maxLives, joined: true },
        turn: 'p1',
        currentWord: starter,
        usedWords: [starter],
        winner: null,
        punishment: ''
      };

      switchView('game');
      renderGameArena();
      startTurnTimer();
    }

    // =========================================================================
    // 7. WAITING ROOM & GAMEPLAY LOGIC
    // =========================================================================
    function renderWaitingRoom() {
      const rs = state.roomState;
      if (!rs) return;

      document.getElementById('display-room-code').textContent = rs.code;
      document.getElementById('waiting-p1-name').textContent = rs.p1.name || 'Pemain 1';

      const p2NameEl = document.getElementById('waiting-p2-name');
      const p2StatusEl = document.getElementById('waiting-p2-status');
      const slotP2 = document.getElementById('slot-p2');
      const btnStart = document.getElementById('btn-start-match');

      if (rs.p2 && rs.p2.joined) {
        p2NameEl.textContent = rs.p2.name;
        p2NameEl.className = 'font-bold text-xs text-white truncate max-w-full';
        p2StatusEl.textContent = 'Siap';
        p2StatusEl.className = 'text-[10px] font-bold text-emerald-400';
        slotP2.classList.add('border-sky-500/40');
      } else {
        p2NameEl.textContent = 'Menunggu...';
        p2NameEl.className = 'font-bold text-xs text-slate-400 truncate max-w-full';
        p2StatusEl.textContent = 'Menunggu';
        p2StatusEl.className = 'text-[10px] font-bold text-amber-400';
        slotP2.classList.remove('border-sky-500/40');
      }

      const hostBox = document.getElementById('host-settings-box');
      if (state.playerRole === 'p1') {
        hostBox.classList.remove('opacity-60', 'pointer-events-none');
        btnStart.disabled = !(rs.p2 && rs.p2.joined);
        btnStart.textContent = (rs.p2 && rs.p2.joined) ? 'Mulai Main' : 'Menunggu Pasangan...';
      } else {
        hostBox.classList.add('opacity-60', 'pointer-events-none');
        btnStart.disabled = true;
        btnStart.textContent = 'Menunggu Host...';
      }

      document.querySelectorAll('.opt-time').forEach(btn => {
        const val = Number(btn.getAttribute('data-time'));
        btn.className = `opt-time tap-btn px-2.5 py-1 rounded-lg text-xs font-extrabold ${
          rs.settings.turnTime === val ? 'bg-rose-500 text-white' : 'bg-slate-800 text-slate-400'
        }`;
      });

      document.querySelectorAll('.opt-lives').forEach(btn => {
        const val = Number(btn.getAttribute('data-lives'));
        btn.className = `opt-lives tap-btn px-3 py-1 rounded-lg text-xs font-extrabold ${
          rs.settings.maxLives === val ? 'bg-rose-500 text-white' : 'bg-slate-800 text-slate-400'
        }`;
      });
    }

    function startMatchAsHost() {
      if (state.playerRole !== 'p1' || !state.roomState) return;
      sfx.success();
      const starter = STARTER_WORDS[Math.floor(Math.random() * STARTER_WORDS.length)];
      const maxLives = state.roomState.settings.maxLives;
      state.fullUsedWords = [starter];

      state.roomState.status = 'playing';
      state.roomState.p1.lives = maxLives;
      state.roomState.p2.lives = maxLives;
      state.roomState.turn = 'p1';
      state.roomState.currentWord = starter;
      state.roomState.usedWords = [starter];
      state.roomState.winner = null;
      state.roomState.punishment = '';

      broadcastRoomState();
      switchView('game');
      renderGameArena();
      startTurnTimer();
    }

    function isMyTurn() {
      if (!state.roomState) return false;
      if (state.mode === 'local') return true;
      return state.roomState.turn === state.playerRole;
    }

    function renderGameArena() {
      const rs = state.roomState;
      if (!rs) return;

      document.getElementById('hud-p1-name').textContent = rs.p1.name;
      document.getElementById('hud-p2-name').textContent = rs.p2.name;
      document.getElementById('hud-p1-lives').textContent = '❤️'.repeat(Math.max(0, rs.p1.lives)) || '💀';
      document.getElementById('hud-p2-lives').textContent = '❤️'.repeat(Math.max(0, rs.p2.lives)) || '💀';

      const hudP1 = document.getElementById('hud-p1');
      const hudP2 = document.getElementById('hud-p2');
      const badgeP1 = document.getElementById('hud-p1-badge');
      const badgeP2 = document.getElementById('hud-p2-badge');

      if (rs.turn === 'p1') {
        hudP1.classList.remove('opacity-60');
        hudP1.classList.add('border-rose-500/60');
        badgeP1.className = 'w-2.5 h-2.5 rounded-full bg-rose-500 animate-ping shrink-0';

        hudP2.classList.add('opacity-60');
        hudP2.classList.remove('border-sky-500/60');
        badgeP2.className = 'w-2.5 h-2.5 rounded-full bg-slate-600 shrink-0';
      } else {
        hudP2.classList.remove('opacity-60');
        hudP2.classList.add('border-sky-500/60');
        badgeP2.className = 'w-2.5 h-2.5 rounded-full bg-sky-400 animate-ping shrink-0';

        hudP1.classList.add('opacity-60');
        hudP1.classList.remove('border-rose-500/60');
        badgeP1.className = 'w-2.5 h-2.5 rounded-full bg-slate-600 shrink-0';
      }

      const parts = getWordDisplayParts(rs.currentWord);
      document.getElementById('word-prefix').textContent = parts.prefix;
      document.getElementById('word-target-syllable').textContent = parts.target;
      document.getElementById('required-prefix-badge').textContent = parts.target;

      const chainEl = document.getElementById('word-chain-list');
      const recentWords = rs.usedWords.slice(-6);
      chainEl.innerHTML = recentWords.map((w, idx) => {
        const isLast = idx === recentWords.length - 1;
        return `<span class="px-2.5 py-1 rounded-lg text-[11px] font-extrabold uppercase shrink-0 ${
          isLast ? 'bg-rose-500/25 text-rose-300 border border-rose-500/40' : 'bg-slate-900/80 text-slate-400 border border-slate-800'
        }">${w}</span>`;
      }).join('<span class="text-slate-600 text-xs">›</span>');
      chainEl.scrollLeft = chainEl.scrollWidth;

      const turnBadge = document.getElementById('turn-indicator');
      const inputEl = document.getElementById('input-word');
      const submitBtn = document.getElementById('btn-submit-word');

      if (state.mode === 'local') {
        const activeName = rs.turn === 'p1' ? rs.p1.name : rs.p2.name;
        turnBadge.textContent = `Giliran ${activeName}`;
        turnBadge.className = 'px-3 py-1 rounded-full text-[11px] font-extrabold bg-amber-500/20 text-amber-300 border border-amber-500/30';
        inputEl.disabled = false;
        submitBtn.disabled = false;
        inputEl.placeholder = `Awalan ${parts.target}...`;
        inputEl.focus();
      } else if (isMyTurn()) {
        turnBadge.textContent = 'Giliranmu!';
        turnBadge.className = 'px-3 py-1 rounded-full text-[11px] font-extrabold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30';
        inputEl.disabled = false;
        submitBtn.disabled = false;
        inputEl.placeholder = `Awalan ${parts.target}...`;
        inputEl.focus();
      } else {
        const partnerName = rs.turn === 'p1' ? rs.p1.name : rs.p2.name;
        turnBadge.textContent = `Giliran ${partnerName}...`;
        turnBadge.className = 'px-3 py-1 rounded-full text-[11px] font-extrabold bg-slate-800 text-slate-400 border border-slate-700';
        inputEl.value = '';
        inputEl.disabled = true;
        submitBtn.disabled = true;
        inputEl.placeholder = 'Menunggu pasangan...';
      }
    }

    function stopTurnTimer() {
      if (state.timerInterval) {
        clearInterval(state.timerInterval);
        state.timerInterval = null;
      }
    }

    function startTurnTimer() {
      stopTurnTimer();
      if (!state.roomState || state.roomState.status !== 'playing') return;

      const maxTime = state.roomState.settings.turnTime || 15;
      state.timeLeft = maxTime;
      updateTimerUI(maxTime);

      state.timerInterval = setInterval(() => {
        if (state.isValidating) return;
        state.timeLeft = Math.max(0, +(state.timeLeft - 0.25).toFixed(2));
        updateTimerUI(maxTime);

        if (state.timeLeft > 0 && state.timeLeft <= 4 && Number.isInteger(state.timeLeft)) {
          sfx.tick();
        }

        if (state.timeLeft <= 0) {
          stopTurnTimer();
          if (state.mode === 'local') {
            handlePlayerTimeout(state.roomState.turn);
          } else if (state.playerRole === 'p1') {
            handlePlayerTimeout(state.roomState.turn);
          } else if (state.roomState.turn === 'p2') {
            sendRoomEvent({ type: 'TIMEOUT' });
          }
        }
      }, 250);
    }

    function updateTimerUI(maxTime) {
      const pct = Math.max(0, Math.min(100, (state.timeLeft / maxTime) * 100));
      const bar = document.getElementById('timer-bar');
      const txt = document.getElementById('timer-text');
      if (bar) {
        bar.style.width = `${pct}%`;
        if (pct <= 30) {
          bar.className = 'h-full bg-gradient-to-r from-rose-500 to-red-500 transition-all duration-200';
        } else if (pct <= 60) {
          bar.className = 'h-full bg-gradient-to-r from-amber-400 to-orange-400 transition-all duration-200';
        } else {
          bar.className = 'h-full bg-gradient-to-r from-emerald-400 to-teal-400 transition-all duration-200';
        }
      }
      if (txt) {
        txt.textContent = `${Math.ceil(state.timeLeft)}s`;
      }
    }

    function handlePlayerTimeout(timedOutRole) {
      const rs = state.roomState;
      if (!rs || rs.status !== 'playing') return;

      sfx.error();
      rs[timedOutRole].lives = Math.max(0, rs[timedOutRole].lives - 1);
      const loserName = rs[timedOutRole].name;
      showToast(`Waktu habis! ${loserName} -1 ❤️`, 'error');

      if (rs[timedOutRole].lives <= 0) {
        finishGame(timedOutRole === 'p1' ? 'p2' : 'p1');
        return;
      }

      rs.turn = timedOutRole === 'p1' ? 'p2' : 'p1';
      if (state.mode === 'online' && state.playerRole === 'p1') {
        broadcastRoomState();
      }
      renderGameArena();
      startTurnTimer();
    }

    function applyAcceptedWord(cleanWord) {
      const rs = state.roomState;
      if (!rs || rs.status !== 'playing') return;

      rs.currentWord = cleanWord;
      rs.usedWords.push(cleanWord);
      if (!state.fullUsedWords.includes(cleanWord)) {
        state.fullUsedWords.push(cleanWord);
      }
      rs.turn = rs.turn === 'p1' ? 'p2' : 'p1';

      sfx.success();
      if (state.mode === 'online' && state.playerRole === 'p1') {
        broadcastRoomState();
      }
      renderGameArena();
      startTurnTimer();
    }

    function triggerInputError(msg) {
      sfx.error();
      showToast(msg, 'error');
      const card = document.getElementById('word-card');
      card.classList.remove('animate-shake');
      void card.offsetWidth;
      card.classList.add('animate-shake');
    }

    async function handleWordSubmit(e) {
      e.preventDefault();
      if (!state.roomState || state.roomState.status !== 'playing') return;
      if (!isMyTurn() || state.isValidating) return;

      const inputEl = document.getElementById('input-word');
      const raw = inputEl.value.trim().toLowerCase();
      if (!raw) return;

      if (!/^[a-z]+$/.test(raw)) {
        triggerInputError('Hanya huruf A-Z tanpa spasi');
        return;
      }

      const requiredPrefix = getTargetSyllable(state.roomState.currentWord).toLowerCase();
      if (!raw.startsWith(requiredPrefix)) {
        triggerInputError(`Harus berawalan "${requiredPrefix.toUpperCase()}"`);
        return;
      }

      if (raw.length <= requiredPrefix.length) {
        triggerInputError('Kata terlalu pendek');
        return;
      }

      if (state.fullUsedWords.includes(raw) || state.roomState.usedWords.includes(raw)) {
        triggerInputError('Kata sudah dipakai!');
        return;
      }

      state.isValidating = true;
      const submitBtn = document.getElementById('btn-submit-word');
      submitBtn.disabled = true;

      const isValidNusantara = await validateNusantaraWord(raw);
      state.isValidating = false;
      submitBtn.disabled = false;

      if (!isValidNusantara) {
        triggerInputError('Bukan kata Indonesia / daerah!');
        return;
      }

      inputEl.value = '';
      if (state.mode === 'online' && state.playerRole === 'p2') {
        sendRoomEvent({ type: 'SUBMIT_WORD', word: raw });
        state.roomState.currentWord = raw;
        state.roomState.usedWords.push(raw);
        state.fullUsedWords.push(raw);
        state.roomState.turn = 'p1';
        sfx.success();
        renderGameArena();
        startTurnTimer();
      } else {
        applyAcceptedWord(raw);
      }
    }

    function pickRandomPunishment() {
      if (!punishmentsList.length) return 'Traktir pasangan pas ketemu!';
      return punishmentsList[Math.floor(Math.random() * punishmentsList.length)];
    }

    function finishGame(winnerRole) {
      const rs = state.roomState;
      if (!rs) return;
      stopTurnTimer();

      rs.status = 'gameover';
      rs.winner = winnerRole;
      rs.punishment = pickRandomPunishment();

      if (state.mode === 'online' && state.playerRole === 'p1') {
        broadcastRoomState();
      }

      sfx.win();
      renderGameOver();
      switchView('gameover');
    }

    function renderGameOver() {
      const rs = state.roomState;
      if (!rs) return;
      const winnerName = rs.winner === 'p1' ? rs.p1.name : rs.p2.name;
      const loserName = rs.winner === 'p1' ? rs.p2.name : rs.p1.name;

      document.getElementById('winner-title').textContent = `${winnerName} Menang!`;
      document.getElementById('loser-subtitle').textContent = `Hukuman untuk ${loserName}`;
      document.getElementById('punishment-result-text').textContent = rs.punishment;

      const btnAgain = document.getElementById('btn-play-again');
      if (state.mode === 'online' && state.playerRole === 'p2') {
        btnAgain.textContent = 'Tunggu Host Main Lagi';
        btnAgain.disabled = true;
      } else {
        btnAgain.textContent = 'Main Lagi';
        btnAgain.disabled = false;
      }
    }

    function leaveToLobby(notifyPartner = true) {
      stopTurnTimer();
      if (notifyPartner && state.mode === 'online') {
        sendRoomEvent({ type: 'PLAYER_LEFT' });
      }
      stopRoomSync();
      const btnJoin = document.getElementById('btn-join-room');
      if (btnJoin) {
        btnJoin.disabled = false;
        btnJoin.textContent = 'Masuk Room';
      }
      state.roomState = null;
      state.roomCode = '';
      state.fullUsedWords = [];
      switchView('lobby');
    }

    function spawnFloatingEmoji(emoji) {
      const appEl = document.getElementById('app');
      const el = document.createElement('div');
      el.className = 'floating-emoji';
      el.textContent = emoji;
      el.style.left = `${20 + Math.random() * 60}%`;
      appEl.appendChild(el);
      setTimeout(() => el.remove(), 1550);
    }

    // =========================================================================
    // 8. PUNISHMENTS MODAL RENDERER
    // =========================================================================
    function renderPunishmentModalList() {
      const container = document.getElementById('punishment-list-container');
      container.innerHTML = punishmentsList.map((item, idx) => `
        <div class="flex items-center justify-between gap-2 p-3 rounded-2xl bg-slate-900/90 border border-slate-800">
          <span class="text-xs font-semibold text-slate-200 leading-snug">${item}</span>
          <button type="button" data-del-idx="${idx}" class="btn-del-punish tap-btn w-7 h-7 rounded-lg bg-rose-500/15 text-rose-400 font-bold text-xs shrink-0 flex items-center justify-center">✕</button>
        </div>
      `).join('');

      container.querySelectorAll('.btn-del-punish').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = Number(btn.getAttribute('data-del-idx'));
          if (punishmentsList.length <= 1) {
            showToast('Minimal 1 hukuman tersisa', 'error');
            return;
          }
          punishmentsList.splice(idx, 1);
          savePunishmentsList();
          renderPunishmentModalList();
          sfx.pop();
        });
      });
      savePunishmentsList();
    }

    // =========================================================================
    // 9. EVENT LISTENERS & INITIALIZATION
    // =========================================================================
    document.getElementById('btn-toggle-sound').addEventListener('click', () => {
      sfx.enabled = !sfx.enabled;
      document.getElementById('icon-sound-on').classList.toggle('hidden', !sfx.enabled);
      document.getElementById('icon-sound-off').classList.toggle('hidden', sfx.enabled);
      if (sfx.enabled) sfx.pop();
    });

    document.getElementById('btn-create-room').addEventListener('click', createOnlineRoom);
    document.getElementById('btn-join-room').addEventListener('click', joinOnlineRoom);
    document.getElementById('input-room-code').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        joinOnlineRoom();
      }
    });
    document.getElementById('btn-local-mode').addEventListener('click', startLocalMode);

    document.getElementById('btn-copy-code').addEventListener('click', () => {
      if (!state.roomCode) return;
      try {
        navigator.clipboard?.writeText(state.roomCode);
      } catch (e) {}
      sfx.pop();
      showToast(`Kode ${state.roomCode} disalin!`, 'success');
    });

    document.querySelectorAll('.opt-time').forEach(btn => {
      btn.addEventListener('click', () => {
        if (state.playerRole !== 'p1' || !state.roomState) return;
        const val = Number(btn.getAttribute('data-time'));
        state.settings.turnTime = val;
        state.roomState.settings.turnTime = val;
        sfx.pop();
        renderWaitingRoom();
        broadcastRoomState();
      });
    });

    document.querySelectorAll('.opt-lives').forEach(btn => {
      btn.addEventListener('click', () => {
        if (state.playerRole !== 'p1' || !state.roomState) return;
        const val = Number(btn.getAttribute('data-lives'));
        state.settings.maxLives = val;
        state.roomState.settings.maxLives = val;
        state.roomState.p1.lives = val;
        state.roomState.p2.lives = val;
        sfx.pop();
        renderWaitingRoom();
        broadcastRoomState();
      });
    });

    document.getElementById('btn-leave-waiting').addEventListener('click', () => {
      sfx.pop();
      leaveToLobby(true);
    });

    document.getElementById('btn-start-match').addEventListener('click', startMatchAsHost);

    document.getElementById('form-word').addEventListener('submit', handleWordSubmit);

    document.getElementById('btn-quit-game').addEventListener('click', () => {
      sfx.pop();
      leaveToLobby(true);
    });

    document.getElementById('btn-reroll-punishment').addEventListener('click', () => {
      if (!state.roomState) return;
      sfx.pop();
      state.roomState.punishment = pickRandomPunishment();
      document.getElementById('punishment-result-text').textContent = state.roomState.punishment;
      if (state.mode === 'online' && state.playerRole === 'p1') {
        broadcastRoomState();
      }
    });

    document.getElementById('btn-play-again').addEventListener('click', () => {
      if (state.mode === 'local') {
        startLocalMode();
      } else if (state.playerRole === 'p1') {
        startMatchAsHost();
      }
    });

    document.getElementById('btn-back-lobby').addEventListener('click', () => {
      sfx.pop();
      leaveToLobby(true);
    });

    // Punishments Modal Controls
    const modalEl = document.getElementById('modal-punishments');
    document.getElementById('btn-open-punishments').addEventListener('click', () => {
      sfx.pop();
      renderPunishmentModalList();
      modalEl.classList.remove('hidden');
    });
    document.getElementById('btn-close-punishments').addEventListener('click', () => {
      sfx.pop();
      modalEl.classList.add('hidden');
    });
    document.getElementById('modal-backdrop').addEventListener('click', () => {
      modalEl.classList.add('hidden');
    });
    document.getElementById('btn-add-punishment').addEventListener('click', () => {
      const inp = document.getElementById('input-new-punishment');
      const val = inp.value.trim();
      if (!val) return;
      punishmentsList.unshift(val);
      inp.value = '';
      savePunishmentsList();
      renderPunishmentModalList();
      sfx.success();
    });
    document.getElementById('input-new-punishment').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        document.getElementById('btn-add-punishment').click();
      }
    });

    // Reactions
    document.querySelectorAll('.emoji-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const emoji = btn.getAttribute('data-emoji');
        if (!emoji) return;
        spawnFloatingEmoji(emoji);
        sfx.pop();
        if (state.mode === 'online') {
          sendRoomEvent({ type: 'REACTION', emoji });
        }
      });
    });

    // Export / Save HTML & Copy Code Tools (auto-hidden when hosted on github.io)
    const exportBar = document.getElementById('export-tools-bar');
    if (exportBar && window.location.hostname.endsWith('github.io')) {
      exportBar.classList.add('hidden');
    }

    function getCleanFullHtmlSource() {
      const cloned = document.documentElement.cloneNode(true);
      const bar = cloned.querySelector('#export-tools-bar');
      if (bar) bar.remove();
      const toast = cloned.querySelector('#toast-container');
      if (toast) toast.innerHTML = '';
      return '<!DOCTYPE html>\n' + cloned.outerHTML;
    }

    document.getElementById('btn-copy-full-code').addEventListener('click', () => {
      const fullHtml = getCleanFullHtmlSource();
      try {
        const temp = document.createElement('textarea');
        temp.value = fullHtml;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand('copy');
        document.body.removeChild(temp);
        sfx.success();
        showToast('Kode HTML tersalin! Siap paste ke GitHub', 'success');
      } catch (e) {
        showToast('Gagal menyalin kode', 'error');
      }
    });

    document.getElementById('btn-download-html').addEventListener('click', () => {
      const fullHtml = getCleanFullHtmlSource();
      const blob = new Blob([fullHtml], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'index.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      sfx.success();
      showToast('File index.html terunduh!', 'success');
    });

    // Boot App
    renderPunishmentModalList();
    checkRelayHealth();
  </script>
</body>
</html>
