<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#090d16" />
  <title>Sambung Kata Nusantara LDR</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    input, select {
      user-select: text;
    }

    html, body {
      height: 100dvh;
      margin: 0;
      padding: 0;
      background-color: #05080f;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #f8fafc;
      overflow: hidden;
    }

    .font-display {
      font-family: 'Space Grotesk', sans-serif;
    }

    .mobile-shell {
      width: 100%;
      max-width: 430px;
      height: 100dvh;
      margin: 0 auto;
      background: radial-gradient(circle at 50% 0%, #261033 0%, #0b1120 48%, #070b14 100%);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    @media (min-width: 450px) {
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 50%, #151c2e 0%, #04060b 100%);
      }
      .mobile-shell {
        height: min(92dvh, 860px);
        border-radius: 44px;
        border: 6px solid #1e293b;
        box-shadow: 0 30px 70px -15px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(255, 255, 255, 0.08);
      }
    }

    .safe-top {
      padding-top: max(env(safe-area-inset-top), 14px);
    }

    .safe-bottom {
      padding-bottom: max(env(safe-area-inset-bottom), 14px);
    }

    .glass-surface {
      background: rgba(20, 28, 45, 0.72);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .ios-input {
      background: rgba(9, 14, 26, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.18s ease;
    }

    .ios-input:focus {
      outline: none;
      border-color: #fb7185;
      box-shadow: 0 0 0 3px rgba(244, 63, 94, 0.2);
    }

    .tap-btn {
      transition: transform 0.12s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.15s ease;
      cursor: pointer;
    }
    .tap-btn:active:not(:disabled) {
      transform: scale(0.95);
    }

    @keyframes floatEmoji {
      0% { transform: translateY(0) scale(0.75); opacity: 1; }
      100% { transform: translateY(-160px) scale(1.4); opacity: 0; }
    }

    .floating-emoji {
      position: absolute;
      pointer-events: none;
      z-index: 60;
      animation: floatEmoji 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes pulseBorder {
      0%, 100% { border-color: rgba(251, 113, 133, 0.45); box-shadow: 0 0 14px rgba(244, 63, 94, 0.25); }
      50% { border-color: rgba(251, 113, 133, 0.95); box-shadow: 0 0 22px rgba(244, 63, 94, 0.55); }
    }

    .turn-active {
      animation: pulseBorder 1.8s infinite;
      background: rgba(244, 63, 94, 0.12);
    }

    @keyframes shakeX {
      0%, 100% { transform: translateX(0); }
      25%, 75% { transform: translateX(-5px); }
      50% { transform: translateX(5px); }
    }

    .shake-anim {
      animation: shakeX 0.3s ease-in-out;
    }

    @keyframes springIn {
      0% { transform: scale(0.94); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .spring-in {
      animation: springIn 0.24s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body>

  <main class="mobile-shell">

    <!-- iOS / Android Top Status & App Header -->
    <header class="safe-top px-5 pb-2 flex items-center justify-between shrink-0 z-20">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-2xl bg-gradient-to-br from-rose-500 to-pink-600 flex items-center justify-center shadow-lg shadow-rose-500/30">
          <svg class="w-4 h-4 text-white" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
        </div>
        <span class="font-display font-extrabold text-base tracking-tight text-white">Sambung Kata</span>
        <span id="conn-dot" class="w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse" title="Menghubungkan"></span>
      </div>

      <div class="flex items-center gap-2">
        <button id="btn-open-punishments" type="button" aria-label="Hukuman"
          class="tap-btn h-9 px-3 rounded-full glass-surface flex items-center gap-1.5 text-xs font-bold text-rose-300">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.2" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/>
          </svg>
          <span id="punishment-count-badge">10</span>
        </button>

        <button id="btn-toggle-sound" type="button" aria-label="Suara"
          class="tap-btn w-9 h-9 rounded-full glass-surface flex items-center justify-center text-slate-200">
          <svg id="icon-sound-on" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
          </svg>
          <svg id="icon-sound-off" class="w-4 h-4 hidden text-slate-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Toast Pill Overlay -->
    <div id="toast-container" class="absolute top-16 left-4 right-4 z-50 flex flex-col items-center gap-1.5 pointer-events-none"></div>

    <!-- =================================================================== -->
    <!-- VIEW 1: LOBBY                                                       -->
    <!-- =================================================================== -->
    <section id="view-lobby" class="flex-1 flex flex-col justify-between px-5 py-3 overflow-y-auto no-scrollbar spring-in">
      <div class="my-auto space-y-4">
        <div class="flex items-center justify-center gap-1.5">
          <span class="px-2.5 py-1 rounded-full bg-rose-500/15 border border-rose-500/30 text-[11px] font-bold text-rose-300">ID</span>
          <span class="px-2.5 py-1 rounded-full bg-amber-500/15 border border-amber-500/30 text-[11px] font-bold text-amber-300">JAWA</span>
          <span class="px-2.5 py-1 rounded-full bg-emerald-500/15 border border-emerald-500/30 text-[11px] font-bold text-emerald-300">SUNDA</span>
          <span class="px-2.5 py-1 rounded-full bg-sky-500/15 border border-sky-500/30 text-[11px] font-bold text-sky-300">LOKAL</span>
        </div>

        <div class="glass-surface rounded-3xl p-5 space-y-4">
          <input id="player-name-input" type="text" maxlength="14" placeholder="Nama kamu..."
            class="ios-input w-full px-4 py-3.5 rounded-2xl text-white placeholder-slate-500 font-bold text-base text-center" />

          <button id="btn-create-room" type="button"
            class="tap-btn w-full py-3.5 px-4 rounded-2xl bg-gradient-to-r from-rose-500 to-pink-600 text-white font-extrabold text-sm shadow-lg shadow-rose-500/25 flex items-center justify-center gap-2">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            Buat Room
          </button>

          <div class="flex gap-2">
            <input id="room-code-input" type="text" maxlength="4" placeholder="KODE"
              class="ios-input w-28 px-3 py-3.5 rounded-2xl text-center text-white font-display font-extrabold text-base tracking-[0.2em] uppercase placeholder-slate-600" />
            <button id="btn-join-room" type="button"
              class="tap-btn flex-1 py-3.5 px-4 rounded-2xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white font-bold text-sm">
              Masuk Room
            </button>
          </div>
        </div>
      </div>

      <div class="safe-bottom pt-2">
        <button id="btn-local-mode" type="button"
          class="tap-btn w-full py-3 px-4 rounded-2xl glass-surface text-slate-300 font-bold text-xs flex items-center justify-center gap-2">
          <svg class="w-4 h-4 text-amber-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <rect x="5" y="2" width="14" height="20" rx="3"/><line x1="12" y1="18" x2="12.01" y2="18"/>
          </svg>
          Pass & Play (1 HP)
        </button>
      </div>
    </section>

    <!-- =================================================================== -->
    <!-- VIEW 2: WAITING ROOM                                                -->
    <!-- =================================================================== -->
    <section id="view-waiting" class="hidden flex-1 flex flex-col justify-between px-5 py-3 overflow-y-auto no-scrollbar spring-in">
      <div class="space-y-4 my-auto">
        <div class="glass-surface rounded-3xl p-5 text-center space-y-3">
          <div class="flex items-center justify-center gap-2">
            <div id="display-room-code"
              class="font-display text-4xl font-black tracking-[0.25em] bg-slate-950/90 border border-rose-500/40 px-5 py-2.5 rounded-2xl text-rose-300 select-all">
              ----
            </div>
            <button id="btn-copy-code" type="button" aria-label="Salin"
              class="tap-btn p-3.5 rounded-2xl bg-slate-800 border border-slate-700 text-slate-200">
              <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
              </svg>
            </button>
          </div>

          <div class="grid grid-cols-2 gap-2.5 pt-1">
            <div class="bg-slate-950/70 border border-rose-500/30 rounded-2xl p-3 text-center">
              <span class="text-[10px] font-extrabold uppercase text-rose-400 block">P1</span>
              <span id="wait-p1-name" class="font-bold text-sm text-white truncate block mt-0.5">-</span>
            </div>
            <div class="bg-slate-950/70 border border-slate-800 rounded-2xl p-3 text-center">
              <span class="text-[10px] font-extrabold uppercase text-amber-400 block">P2</span>
              <span id="wait-p2-name" class="font-bold text-sm text-slate-400 truncate block mt-0.5 animate-pulse">...</span>
            </div>
          </div>
          <div id="wait-status-pill" class="text-[11px] font-bold text-emerald-400">Bagikan kode ke pasangan</div>
        </div>

        <div class="glass-surface rounded-3xl p-4 space-y-3">
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-slate-400">Waktu</span>
            <div id="timer-pills" class="flex gap-1.5">
              <button type="button" data-val="10" class="pill-timer tap-btn px-2.5 py-1 rounded-xl text-xs font-extrabold bg-slate-800 text-slate-300">10d</button>
              <button type="button" data-val="15" class="pill-timer tap-btn px-2.5 py-1 rounded-xl text-xs font-extrabold bg-rose-500 text-white">15d</button>
              <button type="button" data-val="20" class="pill-timer tap-btn px-2.5 py-1 rounded-xl text-xs font-extrabold bg-slate-800 text-slate-300">20d</button>
              <button type="button" data-val="30" class="pill-timer tap-btn px-2.5 py-1 rounded-xl text-xs font-extrabold bg-slate-800 text-slate-300">30d</button>
            </div>
          </div>

          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-slate-400">Nyawa</span>
            <div id="lives-pills" class="flex gap-1.5">
              <button type="button" data-val="3" class="pill-lives tap-btn px-3 py-1 rounded-xl text-xs font-extrabold bg-rose-500 text-white">3 ❤️</button>
              <button type="button" data-val="5" class="pill-lives tap-btn px-3 py-1 rounded-xl text-xs font-extrabold bg-slate-800 text-slate-300">5 ❤️</button>
            </div>
          </div>

          <input id="setting-custom-starter" type="text" maxlength="18" placeholder="Kata awal (opsional)"
            class="ios-input w-full px-3.5 py-2.5 rounded-xl text-xs font-bold text-white placeholder-slate-500 text-center" />
        </div>
      </div>

      <div class="safe-bottom flex gap-2.5 pt-2">
        <button id="btn-leave-waiting" type="button"
          class="tap-btn px-4 py-3.5 rounded-2xl bg-slate-800 text-slate-300 font-bold text-sm">
          Batal
        </button>
        <button id="btn-start-game" type="button" disabled
          class="tap-btn flex-1 py-3.5 rounded-2xl bg-gradient-to-r from-rose-500 to-pink-600 disabled:opacity-40 text-white font-extrabold text-sm shadow-lg shadow-rose-500/25">
          Menunggu P2...
        </button>
      </div>
    </section>

    <!-- =================================================================== -->
    <!-- VIEW 3: IN-GAME ARENA                                               -->
    <!-- =================================================================== -->
    <section id="view-game" class="hidden flex-1 flex flex-col justify-between px-4 pt-1 overflow-hidden spring-in">
      <div class="grid grid-cols-2 gap-2.5 shrink-0">
        <div id="card-p1" class="glass-surface rounded-2xl p-2.5 border transition-all">
          <div class="flex items-center justify-between">
            <span id="game-p1-name" class="font-bold text-xs truncate text-rose-200 max-w-[90px]">P1</span>
            <span class="font-display font-bold text-xs text-slate-400" id="game-p1-score">0</span>
          </div>
          <div id="game-p1-lives" class="text-xs mt-1 tracking-tighter">❤️❤️❤️</div>
        </div>

        <div id="card-p2" class="glass-surface rounded-2xl p-2.5 border transition-all">
          <div class="flex items-center justify-between">
            <span id="game-p2-name" class="font-bold text-xs truncate text-amber-200 max-w-[90px]">P2</span>
            <span class="font-display font-bold text-xs text-slate-400" id="game-p2-score">0</span>
          </div>
          <div id="game-p2-lives" class="text-xs mt-1 tracking-tighter">❤️❤️❤️</div>
        </div>
      </div>

      <div class="flex-1 flex flex-col justify-center gap-3 my-2 min-h-0">
        <div class="glass-surface rounded-3xl p-4 text-center relative overflow-hidden">
          <div class="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden mb-3">
            <div id="timer-bar" class="h-full bg-gradient-to-r from-rose-500 to-amber-400 transition-all duration-150" style="width: 100%;"></div>
          </div>

          <div class="flex items-center justify-between text-[11px] font-bold">
            <span id="last-word-lang-badge" class="px-2 py-0.5 rounded-md bg-emerald-500/15 text-emerald-300 border border-emerald-500/25">ID</span>
            <span class="font-display text-sm text-rose-300"><span id="timer-text">15</span>d</span>
          </div>

          <div id="current-word-display" class="font-display text-3xl sm:text-4xl font-extrabold tracking-wide my-2.5 break-words">
            <span class="text-slate-200">ang</span><span class="text-rose-400 underline decoration-rose-500/70 decoration-4 underline-offset-4">sa</span>
          </div>

          <div class="inline-flex items-center gap-1.5 px-4 py-1 rounded-full bg-rose-500/15 border border-rose-500/40">
            <span id="required-syllable-badge" class="font-display font-black text-rose-300 text-base uppercase tracking-widest">SA</span>
          </div>
        </div>

        <div id="word-history-list" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-1 shrink-0"></div>
      </div>

      <div class="safe-bottom space-y-2 shrink-0">
        <div class="flex items-center justify-between px-1">
          <div class="flex gap-1.5">
            <button type="button" data-emoji="❤️" class="emoji-btn tap-btn w-8 h-8 rounded-full glass-surface text-sm flex items-center justify-center">❤️</button>
            <button type="button" data-emoji="😘" class="emoji-btn tap-btn w-8 h-8 rounded-full glass-surface text-sm flex items-center justify-center">😘</button>
            <button type="button" data-emoji="😂" class="emoji-btn tap-btn w-8 h-8 rounded-full glass-surface text-sm flex items-center justify-center">😂</button>
            <button type="button" data-emoji="🔥" class="emoji-btn tap-btn w-8 h-8 rounded-full glass-surface text-sm flex items-center justify-center">🔥</button>
            <button type="button" data-emoji="🥺" class="emoji-btn tap-btn w-8 h-8 rounded-full glass-surface text-sm flex items-center justify-center">🥺</button>
          </div>
          <button id="btn-quit-game" type="button" aria-label="Keluar"
            class="tap-btn w-8 h-8 rounded-full glass-surface text-slate-400 hover:text-rose-400 flex items-center justify-center">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
          </button>
        </div>

        <form id="word-form" class="flex gap-2">
          <input id="word-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
            placeholder="Ketik kata..."
            class="ios-input flex-1 px-4 py-3.5 rounded-2xl text-white font-bold text-base placeholder-slate-500" />
          <button id="btn-submit-word" type="submit" aria-label="Kirim"
            class="tap-btn w-14 rounded-2xl bg-gradient-to-r from-rose-500 to-pink-600 disabled:opacity-40 text-white font-extrabold shadow-lg shadow-rose-500/25 flex items-center justify-center shrink-0">
            <svg id="submit-btn-icon" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
            <span id="submit-btn-spinner" class="hidden w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
          </button>
        </form>
      </div>
    </section>

    <!-- =================================================================== -->
    <!-- VIEW 4: GAME OVER & LDR PUNISHMENT CARD                             -->
    <!-- =================================================================== -->
    <section id="view-gameover" class="hidden flex-1 flex flex-col justify-between px-5 py-3 overflow-y-auto no-scrollbar spring-in">
      <div class="my-auto space-y-4 text-center">
        <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-rose-500/20 border border-rose-500/40 text-rose-300 text-xs font-extrabold">
          <span>💔</span>
          <span id="loser-name-display">Pemain</span>
          <span>•</span>
          <span id="summary-total-words">0 Kata</span>
        </div>

        <div class="bg-gradient-to-br from-rose-950/90 via-slate-900 to-amber-950/75 border border-rose-500/45 rounded-3xl p-6 shadow-2xl space-y-3">
          <div class="w-11 h-11 rounded-2xl bg-amber-500/20 border border-amber-500/40 text-amber-300 flex items-center justify-center mx-auto text-xl">
            🎲
          </div>
          <p id="punishment-result-text" class="text-base font-extrabold text-white leading-snug min-h-[3.5rem] flex items-center justify-center">
            -
          </p>
        </div>
      </div>

      <div class="safe-bottom space-y-2.5 pt-2">
        <div class="flex gap-2.5">
          <button id="btn-reroll-punishment" type="button"
            class="tap-btn flex-1 py-3.5 rounded-2xl bg-amber-500/20 border border-amber-500/40 text-amber-200 font-bold text-xs flex items-center justify-center gap-1.5">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
              <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
            </svg>
            Acak Lagi
          </button>
          <button id="btn-back-lobby" type="button"
            class="tap-btn px-5 py-3.5 rounded-2xl bg-slate-800 text-slate-300 font-bold text-xs">
            Lobi
          </button>
        </div>

        <button id="btn-play-again" type="button"
          class="tap-btn w-full py-3.5 rounded-2xl bg-gradient-to-r from-rose-500 to-pink-600 text-white font-extrabold text-sm shadow-lg shadow-rose-500/25">
          Main Lagi ❤️
        </button>
      </div>
    </section>

    <!-- =================================================================== -->
    <!-- BOTTOM SHEET MODAL: CUSTOM PUNISHMENTS                              -->
    <!-- =================================================================== -->
    <div id="modal-punishments" class="hidden absolute inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex flex-col justify-end">
      <div class="glass-surface rounded-t-3xl p-5 space-y-3.5 max-h-[78%] flex flex-col border-t border-white/15 safe-bottom spring-in">
        <div class="w-10 h-1 bg-slate-600 rounded-full mx-auto"></div>
        <div class="flex items-center justify-between">
          <span class="font-bold text-sm text-white">Kartu Hukuman LDR 🎲</span>
          <button id="btn-close-modal" type="button" class="tap-btn w-8 h-8 rounded-full bg-slate-800 text-slate-300 text-xs flex items-center justify-center">✕</button>

      if (!soundEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + delay);
        gain.gain.setValueAtTime(volume, audioCtx.currentTime + delay);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + delay);
        osc.stop(audioCtx.currentTime + delay + duration);
      } catch (e) {}
    }

    const VOWELS = new Set(['a', 'i', 'u', 'e', 'o']);

    function splitIndonesianSyllables(rawWord) {
      const word = rawWord.toLowerCase().replace(/[^a-z]/g, '');
      if (word.length <= 2) return [word];

      let tokens = [];
      for (let i = 0; i < word.length; i++) {
        const pair = word.slice(i, i + 2);
        if (DIGRAPHS.includes(pair)) {
          tokens.push(pair);
          i++;
        } else {
          tokens.push(word[i]);
        }
      }

      const vowelIndices = [];
      tokens.forEach((t, idx) => {
        if (VOWELS.has(t)) vowelIndices.push(idx);
      });

      if (vowelIndices.length <= 1) return [word];

      const syllables = [];
      let start = 0;

      for (let v = 0; v < vowelIndices.length - 1; v++) {
        const currV = vowelIndices[v];
        const nextV = vowelIndices[v + 1];
        const between = nextV - currV - 1;
        let splitIdx;

        if (between === 0) {
          splitIdx = nextV;
        } else if (between === 1) {
          splitIdx = currV + 1;
        } else if (between === 2) {
          splitIdx = currV + 2;
        } else {
          splitIdx = nextV - 1;
        }

        syllables.push(tokens.slice(start, splitIdx).join(''));
        start = splitIdx;
      }

      syllables.push(tokens.slice(start).join(''));
      return syllables.filter(Boolean);
    }

    function getLastSyllable(word) {
      const syls = splitIndonesianSyllables(word);
      const last = syls[syls.length - 1] || word.slice(-2);

        return word.slice(-2).toLowerCase();
      }
      return last.toLowerCase();

    const apiDictCache = new Map();

    async function checkOnlineNusantaraDict(word) {
      if (apiDictCache.has(word)) return apiDictCache.get(word);

      const endpoints = [
        `https://id.wiktionary.org/w/api.php?action=query&titles=${encodeURIComponent(word)}&format=json&origin=*`,
        `https://jv.wiktionary.org/w/api.php?action=query&titles=${encodeURIComponent(word)}&format=json&origin=*`,
        `https://su.wiktionary.org/w/api.php?action=query&titles=${encodeURIComponent(word)}&format=json&origin=*`
      ];

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 1400);

        const checks = endpoints.map(async (url, idx) => {
          const res = await fetch(url, { signal: controller.signal });
          if (!res.ok) return null;
          const data = await res.json();
          const pages = data?.query?.pages || {};
          const pageIds = Object.keys(pages);
          if (pageIds.length > 0 && pageIds[0] !== '-1') {
            return idx === 0 ? 'ID' : idx === 1 ? 'JAWA' : 'SUNDA';
          }
          return null;
        });

        const results = await Promise.allSettled(checks);
        clearTimeout(timeoutId);

        for (const r of results) {
          if (r.status === 'fulfilled' && r.value) {
            apiDictCache.set(word, r.value);
            return r.value;
          }
        }
      } catch (e) {}

      apiDictCache.set(word, false);
      return false;
    }

    function looksLikeForeignOrGibberish(word) {
      if (/[qwxz]/.test(word)) return true;
      if (/(th|sh|ch|gh|ph|ck|oo|ee|ea|ou|tion|sion|ing|ght|wh|qu)/.test(word)) return true;
      if (/[^aiueo]{4,}/.test(word)) return true;
      if (/[aiueo]{4,}/.test(word)) return true;
      if (!/[aiueo]/.test(word)) return true;
      return false;
    }

    async function validateNusantaraWord(rawInput) {
      const clean = rawInput.trim().toLowerCase().replace(/[^a-z]/g, '');
      if (clean.length < 2) {
        return { valid: false, reason: 'Minimal 2 huruf!' };
      }

      if (BUILTIN_NUSANTARA_DICT.has(clean)) {
        return { valid: true, word: clean, lang: 'NUSANTARA' };
      }

      if (looksLikeForeignOrGibberish(clean)) {
        return { valid: false, reason: `"${clean.toUpperCase()}" bukan kata Nusantara!` };
      }

      const wikiLang = await checkOnlineNusantaraDict(clean);
      if (wikiLang) {
        return { valid: true, word: clean, lang: wikiLang };
      }

      const affixes = /^(me|men|mem|meng|meny|ber|ter|di|ke|se|pe|pen|pem|peng|peny)[a-z]{3,}$/;
      const suffixes = /^[a-z]{3,}(kan|an|i|nya|lah|kah|ku|mu)$/;
      if ((affixes.test(clean) || suffixes.test(clean)) && clean.length >= 5) {
        return { valid: true, word: clean, lang: 'ID' };
      }

      return { valid: false, reason: `"${clean.toUpperCase()}" tidak ada di kamus Nusantara!` };
    }

    function initMqttBroker() {
      if (typeof mqtt === 'undefined') {

        connectTimeout: 5000,

        setConnectionDot('connected');

        if (subscribedStateTopic) {
          mqttClient.subscribe(subscribedStateTopic, { qos: 1 });

        }
        if (typeof pendingRoomAction === 'function') {
          const fn = pendingRoomAction;
          pendingRoomAction = null;
          fn();
        }
      });

      mqttClient.on('error', () => {
        mqttConnected = false;
        mqttBrokerIndex++;
        setConnectionDot('connecting');
      });

      mqttClient.on('close', () => {
        mqttConnected = false;
        setConnectionDot('connecting');
      });

      mqttClient.on('message', (topic, messageBuffer) => {
        if (!subscribedStateTopic && !subscribedEventsTopic) return;
        if (topic !== subscribedStateTopic && topic !== subscribedEventsTopic) return;
        const rawStr = messageBuffer.toString();
        if (!rawStr) return;

        try {
          const packet = JSON.parse(rawStr);
          if (!packet || packet._sender === clientSessionId) return;

          if (packet._kind === 'STATE' && packet.data) {
            if (state.mode === 'online' && packet.data.roomCode === state.roomCode) {
              syncUIWithRoomState(packet.data);
            }
          } else if (packet._kind === 'EVENT' && packet.evt) {
            const evt = packet.evt;
            if (!evt.id || evt.id === lastProcessedEventId) return;
            lastProcessedEventId = evt.id;

            if (evt.type === 'JOIN_REQUEST' && state.playerRole === 'p1' && state.roomState) {
              const incomingName = evt.playerName || 'Pasangan';
              const isNewJoin = !state.roomState.p2 || state.roomState.p2.name !== incomingName;
              state.roomState = {
                ...state.roomState,
                p2: {
                  name: incomingName,
                  lives: state.selectedLives,
                  score: 0
                }
              };
              if (isNewJoin) {
                sfx.success();
                showToast(`${incomingName} bergabung!`, 'success');
              }
              broadcastRoomState();
            } else if (evt.type === 'REACTION' && evt.emoji) {
              spawnFloatingEmoji(evt.emoji);
              sfx.pop();
            } else if (evt.type === 'PLAYER_LEFT') {
              showToast('Pasangan keluar dari room', 'error');
              sfx.error();
              if (state.playerRole === 'p1' && state.roomState) {
                state.roomState = { ...state.roomState, status: 'waiting', p2: null };
                broadcastRoomState();
              } else {
                resetToLobby(false);
              }
            }
          }
        } catch (e) {}
      });
    }

    function cleanupMultiplayer() {
      if (heartbeatTimer) {
        clearInterval(heartbeatTimer);
        heartbeatTimer = null;
      }
      if (mqttClient && mqttConnected) {
        try {
          if (subscribedStateTopic) mqttClient.unsubscribe(subscribedStateTopic);
          if (subscribedEventsTopic) mqttClient.unsubscribe(subscribedEventsTopic);
        } catch (e) {}
      }
      subscribedStateTopic = null;
      subscribedEventsTopic = null;
      lastProcessedEventId = '';
      pendingRoomAction = null;
      setConnectionDot(mqttConnected ? 'connected' : 'connecting');
    }

    function subscribeToRoom(code) {
      const stateTopic = ROOM_TOPIC_PREFIX + code;
      const eventsTopic = stateTopic + EVENTS_TOPIC_SUFFIX;
      if (mqttClient && mqttConnected) {
        try {
          if (subscribedStateTopic && subscribedStateTopic !== stateTopic) mqttClient.unsubscribe(subscribedStateTopic);
          if (subscribedEventsTopic && subscribedEventsTopic !== eventsTopic) mqttClient.unsubscribe(subscribedEventsTopic);
        } catch (e) {}
      }
      subscribedStateTopic = stateTopic;
      subscribedEventsTopic = eventsTopic;
      if (mqttClient && mqttConnected) {
        mqttClient.subscribe(stateTopic, { qos: 1 });
        mqttClient.subscribe(eventsTopic, { qos: 1 });
      }
    }

    function sendRoomEvent(payload) {
      if (!subscribedEventsTopic || !mqttClient || !mqttConnected) return;
      const evt = {
        ...payload,
        id: `${Date.now()}_${Math.random().toString(36).slice(2, 7)}`
      };
      mqttClient.publish(
        subscribedEventsTopic,
        JSON.stringify({ _kind: 'EVENT', _sender: clientSessionId, evt }),
        { qos: 1, retain: false }
      );
    }

    function broadcastRoomState() {
      if (!state.roomState) return;
      syncUIWithRoomState(state.roomState);
      if (subscribedStateTopic && mqttClient && mqttConnected) {
        mqttClient.publish(
          subscribedStateTopic,
          JSON.stringify({
            _kind: 'STATE',
            _sender: clientSessionId,
            _ts: Date.now(),
            data: state.roomState
          }),
          { qos: 1, retain: true }
        );
      }
    }

    function createOnlineRoom() {
      cleanupMultiplayer();
      const code = generateRoomCode();
      const p1Name = document.getElementById('player-name-input').value.trim() || 'P1';
      const starter = getRandomStarterWord();

      state.mode = 'online';
      state.roomCode = code;
      state.playerRole = 'p1';
      state.roomState = {
        roomCode: code,
        status: 'waiting',
        settings: {
          turnDuration: state.selectedTimer,
          maxLives: state.selectedLives,
          customStarter: ''
        },
        p1: { name: p1Name, lives: state.selectedLives, score: 0 },
        p2: null,
        turn: 'p1',
        currentWord: starter,
        lastWordLabel: 'NUSANTARA',
        requiredSyllable: getLastSyllable(starter),
        usedWords: [starter],
        round: 1,
        turnStartedAt: Date.now(),
        loser: null,
        winner: null,
        punishment: '',
        punishmentsPool: punishmentsList
      };

      sfx.success();
      subscribeToRoom(code);
      broadcastRoomState();

      heartbeatTimer = setInterval(() => {
        if (state.mode === 'online' && state.playerRole === 'p1' && state.roomState && subscribedStateTopic && mqttClient && mqttConnected) {
          mqttClient.publish(
            subscribedStateTopic,
            JSON.stringify({
              _kind: 'STATE',
              _sender: clientSessionId,
              _ts: Date.now(),
              data: state.roomState
            }),
            { qos: 0, retain: true }
          );
        }
      }, 2500);
    }

    function joinOnlineRoom() {
      const rawCode = document.getElementById('room-code-input').value.trim().toUpperCase();
      if (rawCode.length !== 4) {
        showToast('Masukkan 4 huruf kode room!', 'error');
        sfx.error();
        return;
      }

      const joinBtn = document.getElementById('btn-join-room');
      joinBtn.disabled = true;
      joinBtn.textContent = 'Mencari...';

      const executeJoin = () => {
        cleanupMultiplayer();
        const p2Name = document.getElementById('player-name-input').value.trim() || 'P2';
        state.mode = 'online';
        state.roomCode = rawCode;
        state.playerRole = 'p2';
        state.roomState = null;

        subscribeToRoom(rawCode);

        let attempts = 0;
        const sendJoinPing = () => {
          if (state.mode !== 'online' || state.playerRole !== 'p2') return;
          if (state.roomState) return;
          sendRoomEvent({ type: 'JOIN_REQUEST', playerName: p2Name });
          attempts++;
          if (attempts < 8) {
            setTimeout(sendJoinPing, 750);
          } else if (!state.roomState) {
            joinBtn.disabled = false;
            joinBtn.textContent = 'Masuk Room';
            showToast('Room tidak ditemukan!', 'error');
            sfx.error();
            cleanupMultiplayer();
            state.mode = null;
            state.roomCode = null;
            state.playerRole = null;
          }
        };

        setTimeout(sendJoinPing, 250);
      };

      if (mqttConnected) {
        executeJoin();
      } else {
        pendingRoomAction = executeJoin;
        initMqttBroker();
        setTimeout(() => {
          if (pendingRoomAction === executeJoin) {
            pendingRoomAction = null;
            joinBtn.disabled = false;
            joinBtn.textContent = 'Masuk Room';
            showToast('Koneksi lambat, coba lagi', 'error');
          }
        }, 5500);
      }
    }

    // =========================================================================
    // 6. LOCAL PASS & PLAY MODE (1 HP)
    // =========================================================================
    function startLocalMode() {
      cleanupMultiplayer();
      const p1Name = document.getElementById('player-name-input').value.trim() || 'Aku';
      const starter = getRandomStarterWord();

      state.mode = 'local';
      state.roomCode = 'LOKAL';
      state.playerRole = 'both';
      state.roomState = {
        roomCode: 'LOKAL',
        status: 'playing',
        settings: {
          turnDuration: state.selectedTimer,
          maxLives: state.selectedLives,
          customStarter: ''
        },
        p1: { name: p1Name, lives: state.selectedLives, score: 0 },
        p2: { name: 'Pasangan', lives: state.selectedLives, score: 0 },
        turn: 'p1',
        currentWord: starter,
        lastWordLabel: 'NUSANTARA',
        requiredSyllable: getLastSyllable(starter),
        usedWords: [starter],
        round: 1,
        turnStartedAt: Date.now(),
        loser: null,
        winner: null,
        punishment: '',
        punishmentsPool: punishmentsList
      };

      sfx.success();
      syncUIWithRoomState(state.roomState);
    }

    // =========================================================================
    // 7. GAMEPLAY SYNC, TIMER & TURN HANDLING
    // =========================================================================
    function syncUIWithRoomState(rs) {
      if (!rs) return;
      state.roomState = rs;

      const joinBtn = document.getElementById('btn-join-room');
      if (joinBtn && joinBtn.disabled) {
        joinBtn.disabled = false;
        joinBtn.textContent = 'Masuk Room';
      }

      if (rs.status === 'waiting') {
        showView('waiting');
        document.getElementById('display-room-code').textContent = rs.roomCode;
        document.getElementById('wait-p1-name').textContent = rs.p1?.name || 'P1';

        const p2El = document.getElementById('wait-p2-name');
        const statusPill = document.getElementById('wait-status-pill');
        const startBtn = document.getElementById('btn-start-game');

        if (rs.p2) {
          p2El.textContent = rs.p2.name;
          p2El.classList.remove('animate-pulse', 'text-slate-400');
          p2El.classList.add('text-amber-300');
          statusPill.textContent = 'Pasangan siap bermain!';

          if (state.playerRole === 'p1') {
            startBtn.disabled = false;
            startBtn.textContent = 'Mulai Main ❤️';
          } else {
            startBtn.disabled = true;
            startBtn.textContent = 'Menunggu P1 memulai...';
          }
        } else {
          p2El.textContent = '...';
          p2El.classList.add('animate-pulse', 'text-slate-400');
          p2El.classList.remove('text-amber-300');
          statusPill.textContent = 'Bagikan kode ke pasangan';
          startBtn.disabled = true;
          startBtn.textContent = 'Menunggu P2...';
        }
        return;
      }

      if (rs.status === 'playing') {
        showView('game');
        renderArena(rs);
        startTurnTimer(rs);
        return;
      }

      if (rs.status === 'gameover') {
        stopTurnTimer();
        showView('gameover');
        const loserName = rs.loser === 'p1' ? (rs.p1?.name || 'P1') : (rs.p2?.name || 'P2');
        document.getElementById('loser-name-display').textContent = `${loserName} Kalah`;
        document.getElementById('summary-total-words').textContent = `${(rs.usedWords?.length || 1) - 1} Kata`;
        document.getElementById('punishment-result-text').textContent = rs.punishment || punishmentsList[0];

        if (state.lastRenderedStatus !== 'gameover') {
          sfx.gameover();
        }
        state.lastRenderedStatus = 'gameover';
        return;
      }

      state.lastRenderedStatus = rs.status;
    }

    function renderArena(rs) {
      document.getElementById('game-p1-name').textContent = rs.p1?.name || 'P1';
      document.getElementById('game-p2-name').textContent = rs.p2?.name || 'P2';
      document.getElementById('game-p1-score').textContent = rs.p1?.score || 0;
      document.getElementById('game-p2-score').textContent = rs.p2?.score || 0;

      const maxLives = rs.settings?.maxLives || 3;
      const p1Lives = Math.max(0, rs.p1?.lives ?? maxLives);
      const p2Lives = Math.max(0, rs.p2?.lives ?? maxLives);
      document.getElementById('game-p1-lives').textContent = '❤️'.repeat(p1Lives) + '🖤'.repeat(Math.max(0, maxLives - p1Lives));
      document.getElementById('game-p2-lives').textContent = '❤️'.repeat(p2Lives) + '🖤'.repeat(Math.max(0, maxLives - p2Lives));

      const cardP1 = document.getElementById('card-p1');
      const cardP2 = document.getElementById('card-p2');
      cardP1.classList.toggle('turn-active', rs.turn === 'p1');
      cardP2.classList.toggle('turn-active', rs.turn === 'p2');

      const word = rs.currentWord || 'angsa';
      const req = rs.requiredSyllable || getLastSyllable(word);
      const prefixPart = word.slice(0, Math.max(0, word.length - req.length));
      const suffixPart = word.slice(Math.max(0, word.length - req.length));

      document.getElementById('current-word-display').innerHTML =
        `<span class="text-slate-200">${prefixPart}</span><span class="text-rose-400 underline decoration-rose-500/70 decoration-4 underline-offset-4">${suffixPart}</span>`;
      document.getElementById('required-syllable-badge').textContent = req.toUpperCase();
      document.getElementById('last-word-lang-badge').textContent = rs.lastWordLabel || 'NUSANTARA';

      const historyEl = document.getElementById('word-history-list');
      const recent = (rs.usedWords || []).slice(-6);
      historyEl.innerHTML = recent.map((w, idx) => {
        const isLast = idx === recent.length - 1;
        return `<span class="px-2.5 py-1 rounded-full text-[11px] font-bold shrink-0 ${isLast ? 'bg-rose-500/25 border border-rose-500/50 text-rose-200' : 'bg-slate-900/80 text-slate-400 border border-slate-800'}">${w}</span>`;
      }).join('');
      historyEl.scrollLeft = historyEl.scrollWidth;

      const isMyTurn = state.mode === 'local' || state.playerRole === rs.turn;
      const inputEl = document.getElementById('word-input');
      const submitBtn = document.getElementById('btn-submit-word');

      if (!state.isValidating) {
        inputEl.disabled = !isMyTurn;
        submitBtn.disabled = !isMyTurn;
      }

      if (isMyTurn) {
        const activeName = rs.turn === 'p1' ? (rs.p1?.name || 'P1') : (rs.p2?.name || 'P2');
        inputEl.placeholder = state.mode === 'local'
          ? `Giliran ${activeName} (${req.toUpperCase()}...)`
          : `Awali dengan "${req.toUpperCase()}"...`;
        if (state.lastRenderedWord !== word || state.lastRenderedStatus !== 'playing') {
          inputEl.value = '';
          setTimeout(() => inputEl.focus(), 60);
        }
      } else {
        const waitingName = rs.turn === 'p1' ? (rs.p1?.name || 'P1') : (rs.p2?.name || 'P2');
        inputEl.placeholder = `Menunggu ${waitingName}...`;
      }

      state.lastRenderedWord = word;
      state.lastRenderedStatus = 'playing';
    }

    function stopTurnTimer() {
      if (state.timerInterval) {
        clearInterval(state.timerInterval);
        state.timerInterval = null;
      }
    }

    function startTurnTimer(rs) {
      stopTurnTimer();
      const duration = rs.settings?.turnDuration || 15;
      let lastSecondBeep = -1;

      const tick = () => {
        if (!state.roomState || state.roomState.status !== 'playing') {
          stopTurnTimer();
          return;
        }
        if (state.isValidating) return;

        const elapsed = (Date.now() - (state.roomState.turnStartedAt || Date.now())) / 1000;
        const remaining = Math.max(0, duration - elapsed);
        const ceilRem = Math.ceil(remaining);

        document.getElementById('timer-text').textContent = ceilRem;
        document.getElementById('timer-bar').style.width = `${Math.max(0, (remaining / duration) * 100)}%`;

        if (ceilRem <= 4 && ceilRem > 0 && ceilRem !== lastSecondBeep) {
          lastSecondBeep = ceilRem;
          sfx.tick();
        }

        if (remaining <= 0) {
          stopTurnTimer();
          const canHandleTimeout = state.mode === 'local' || state.playerRole === state.roomState.turn;
          if (canHandleTimeout) {
            handleTurnTimeout();
          }
        }
      };

      tick();
      state.timerInterval = setInterval(tick, 150);
    }

    function handleTurnTimeout() {
      const rs = state.roomState;
      if (!rs || rs.status !== 'playing') return;

      const timedOutRole = rs.turn;
      const nextRole = timedOutRole === 'p1' ? 'p2' : 'p1';
      const updatedPlayer = {
        ...rs[timedOutRole],
        lives: Math.max(0, (rs[timedOutRole]?.lives || 1) - 1)
      };

      sfx.error();
      showToast(`Waktu ${updatedPlayer.name} habis! -1 ❤️`, 'error');

      if (updatedPlayer.lives <= 0) {
        const pool = rs.punishmentsPool && rs.punishmentsPool.length > 0 ? rs.punishmentsPool : punishmentsList;
        const randomPunishment = pool[Math.floor(Math.random() * pool.length)];
        state.roomState = {
          ...rs,
          [timedOutRole]: updatedPlayer,
          status: 'gameover',
          loser: timedOutRole,
          winner: nextRole,
          punishment: randomPunishment
        };
      } else {
        state.roomState = {
          ...rs,
          [timedOutRole]: updatedPlayer,
          turn: nextRole,
          turnStartedAt: Date.now()
        };
      }

      broadcastRoomState();
    }

    async function handleWordSubmit(e) {
      e.preventDefault();
      const rs = state.roomState;
      if (!rs || rs.status !== 'playing' || state.isValidating) return;

      const isMyTurn = state.mode === 'local' || state.playerRole === rs.turn;
      if (!isMyTurn) return;

      const inputEl = document.getElementById('word-input');
      const raw = inputEl.value.trim().toLowerCase().replace(/[^a-z]/g, '');
      const req = (rs.requiredSyllable || '').toLowerCase();

      if (!raw) return;

      if (!raw.startsWith(req)) {
        sfx.error();
        inputEl.classList.add('shake-anim');
        setTimeout(() => inputEl.classList.remove('shake-anim'), 320);
        showToast(`Harus diawali "${req.toUpperCase()}"!`, 'error');
        return;
      }

      if ((rs.usedWords || []).includes(raw)) {
        sfx.error();
        inputEl.classList.add('shake-anim');
        setTimeout(() => inputEl.classList.remove('shake-anim'), 320);
        showToast('Kata sudah dipakai!', 'error');
        return;
      }

      state.isValidating = true;
      document.getElementById('submit-btn-icon').classList.add('hidden');
      document.getElementById('submit-btn-spinner').classList.remove('hidden');
      document.getElementById('btn-submit-word').disabled = true;

      const result = await validateNusantaraWord(raw);

      state.isValidating = false;
      document.getElementById('submit-btn-icon').classList.remove('hidden');
      document.getElementById('submit-btn-spinner').classList.add('hidden');
      document.getElementById('btn-submit-word').disabled = false;

      if (!result.valid) {
        sfx.error();
        inputEl.classList.add('shake-anim');
        setTimeout(() => inputEl.classList.remove('shake-anim'), 320);
        showToast(result.reason, 'error');
        inputEl.focus();
        return;
      }

      const currentRole = rs.turn;
      const nextRole = currentRole === 'p1' ? 'p2' : 'p1';
      const nextSyllable = getLastSyllable(result.word);

      sfx.success();
      inputEl.value = '';

      state.roomState = {
        ...rs,
        [currentRole]: {
          ...rs[currentRole],
          score: (rs[currentRole]?.score || 0) + 1
        },
        turn: nextRole,
        currentWord: result.word,
        lastWordLabel: result.lang,
        requiredSyllable: nextSyllable,
        usedWords: [...(rs.usedWords || []), result.word],
        turnStartedAt: Date.now()
      };

      broadcastRoomState();
    }

    function startOnlineMatch() {
      const rs = state.roomState;
      if (!rs || state.playerRole !== 'p1' || !rs.p2) return;

      const customRaw = document.getElementById('setting-custom-starter').value.trim().toLowerCase().replace(/[^a-z]/g, '');
      const starter = customRaw.length >= 2 ? customRaw : getRandomStarterWord();

      state.roomState = {
        ...rs,
        status: 'playing',
        settings: {
          turnDuration: state.selectedTimer,
          maxLives: state.selectedLives,
          customStarter: customRaw
        },
        p1: { ...rs.p1, lives: state.selectedLives, score: 0 },
        p2: { ...rs.p2, lives: state.selectedLives, score: 0 },
        turn: 'p1',
        currentWord: starter,
        lastWordLabel: 'NUSANTARA',
        requiredSyllable: getLastSyllable(starter),
        usedWords: [starter],
        turnStartedAt: Date.now(),
        loser: null,
        winner: null,
        punishment: '',
        punishmentsPool: punishmentsList
      };

      sfx.success();
      broadcastRoomState();
    }

    function rerollPunishment() {
      const rs = state.roomState;
      if (!rs) return;
      const pool = punishmentsList.length > 0 ? punishmentsList : DEFAULT_PUNISHMENTS;
      let nextP = pool[Math.floor(Math.random() * pool.length)];
      if (pool.length > 1 && nextP === rs.punishment) {
        nextP = pool[(pool.indexOf(nextP) + 1) % pool.length];
      }
      sfx.pop();
      state.roomState = { ...rs, punishment: nextP };
      broadcastRoomState();
    }

    function playAgain() {
      const rs = state.roomState;
      if (!rs) return;

      if (state.mode === 'local') {
        startLocalMode();
        return;
      }

      const maxLives = rs.settings?.maxLives || state.selectedLives;
      const starter = getRandomStarterWord();
      state.roomState = {
        ...rs,
        status: 'playing',
        p1: { ...rs.p1, lives: maxLives, score: 0 },
        p2: { ...rs.p2, lives: maxLives, score: 0 },
        turn: rs.loser || 'p1',
        currentWord: starter,
        lastWordLabel: 'NUSANTARA',
        requiredSyllable: getLastSyllable(starter),
        usedWords: [starter],
        round: (rs.round || 1) + 1,
        turnStartedAt: Date.now(),
        loser: null,
        winner: null,
        punishment: '',
        punishmentsPool: punishmentsList
      };

      sfx.success();
      broadcastRoomState();
    }

    function resetToLobby(notify = true) {
      if (notify && state.mode === 'online') {
        if (state.playerRole === 'p1' && subscribedStateTopic && mqttClient && mqttConnected) {
          mqttClient.publish(subscribedStateTopic, '', { qos: 1, retain: true });
        }
        sendRoomEvent({ type: 'PLAYER_LEFT' });
      }
      stopTurnTimer();
      cleanupMultiplayer();
      state.mode = null;
      state.roomCode = null;
      state.playerRole = null;
      state.roomState = null;
      state.lastRenderedWord = null;
      state.lastRenderedStatus = null;

      const joinBtn = document.getElementById('btn-join-room');
      if (joinBtn) {
        joinBtn.disabled = false;
        joinBtn.textContent = 'Masuk Room';
      }
      showView('lobby');
    }

    // =========================================================================
    // 8. PUNISHMENTS MODAL RENDERER
    // =========================================================================
    function renderPunishmentModalList() {
      const badge = document.getElementById('punishment-count-badge');
      if (badge) badge.textContent = punishmentsList.length;

      const ul = document.getElementById('punishment-list-ul');
      if (!ul) return;

      ul.innerHTML = punishmentsList.map((item, index) => `
        <li class="flex items-center justify-between gap-2 bg-slate-900/90 border border-slate-800 px-3.5 py-2.5 rounded-2xl">
          <span class="text-slate-200 font-semibold leading-snug">${item}</span>
          ${punishmentsList.length > 1 ? `
            <button type="button" data-del-idx="${index}" class="btn-del-punishment tap-btn w-7 h-7 rounded-xl bg-rose-500/15 text-rose-400 font-bold shrink-0 flex items-center justify-center">✕</button>
          ` : ''}
        </li>
      `).join('');

      ul.querySelectorAll('.btn-del-punishment').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = parseInt(btn.getAttribute('data-del-idx'), 10);
          if (!isNaN(idx) && punishmentsList.length > 1) {
            punishmentsList.splice(idx, 1);
            savePunishmentsList();
            renderPunishmentModalList();
            sfx.pop();
          }
        });
      });
    }

    // =========================================================================
    // 9. BIND ALL EVENT LISTENERS & INITIALIZE
    // =========================================================================
    document.getElementById('btn-create-room').addEventListener('click', createOnlineRoom);
    document.getElementById('btn-join-room').addEventListener('click', joinOnlineRoom);
    document.getElementById('btn-local-mode').addEventListener('click', startLocalMode);
    document.getElementById('btn-leave-waiting').addEventListener('click', () => resetToLobby(true));
    document.getElementById('btn-start-game').addEventListener('click', startOnlineMatch);
    document.getElementById('btn-quit-game').addEventListener('click', () => resetToLobby(true));
    document.getElementById('btn-reroll-punishment').addEventListener('click', rerollPunishment);
    document.getElementById('btn-back-lobby').addEventListener('click', () => resetToLobby(true));
    document.getElementById('btn-play-again').addEventListener('click', playAgain);
    document.getElementById('word-form').addEventListener('submit', handleWordSubmit);

    document.getElementById('btn-copy-code').addEventListener('click', () => {
      const code = state.roomCode || '';
      if (!code) return;
      try {
        const temp = document.createElement('textarea');
        temp.value = code;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand('copy');
        document.body.removeChild(temp);
      } catch (e) {}
      sfx.pop();
      showToast(`Kode ${code} disalin!`, 'success');
    });

    document.getElementById('btn-toggle-sound').addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      document.getElementById('icon-sound-on').classList.toggle('hidden', !soundEnabled);
      document.getElementById('icon-sound-off').classList.toggle('hidden', soundEnabled);
      if (soundEnabled) sfx.pop();
    });

    document.getElementById('btn-open-punishments').addEventListener('click', () => {
      renderPunishmentModalList();
      document.getElementById('modal-punishments').classList.remove('hidden');
      sfx.pop();
    });

    document.getElementById('btn-close-modal').addEventListener('click', () => {
      document.getElementById('modal-punishments').classList.add('hidden');
      sfx.pop();
    });

    document.getElementById('modal-punishments').addEventListener('click', (e) => {
      if (e.target.id === 'modal-punishments') {
        document.getElementById('btn-close-modal').click();
      }
    });

    document.getElementById('btn-add-punishment').addEventListener('click', () => {
      const inp = document.getElementById('new-punishment-input');
      const val = inp.value.trim();
      if (!val) return;
      punishmentsList.unshift(val);
      savePunishmentsList();
      inp.value = '';
      renderPunishmentModalList();
      sfx.success();
    });

    document.getElementById('new-punishment-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        document.getElementById('btn-add-punishment').click();
      }
    });

    document.getElementById('room-code-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        joinOnlineRoom();
      }
    });

    document.querySelectorAll('.pill-timer').forEach(btn => {
      btn.addEventListener('click', () => {
        const val = parseInt(btn.getAttribute('data-val'), 10);
        if (isNaN(val)) return;
        state.selectedTimer = val;
        document.querySelectorAll('.pill-timer').forEach(b => {
          const active = parseInt(b.getAttribute('data-val'), 10) === val;
          b.className = `pill-timer tap-btn px-2.5 py-1 rounded-xl text-xs font-extrabold ${active ? 'bg-rose-500 text-white' : 'bg-slate-800 text-slate-300'}`;
        });
        if (state.roomState && state.playerRole === 'p1') {
          state.roomState.settings.turnDuration = val;
          broadcastRoomState();
        }
        sfx.pop();
      });
    });

    document.querySelectorAll('.pill-lives').forEach(btn => {
      btn.addEventListener('click', () => {
        const val = parseInt(btn.getAttribute('data-val'), 10);
        if (isNaN(val)) return;
        state.selectedLives = val;
        document.querySelectorAll('.pill-lives').forEach(b => {
          const active = parseInt(b.getAttribute('data-val'), 10) === val;
          b.className = `pill-lives tap-btn px-3 py-1 rounded-xl text-xs font-extrabold ${active ? 'bg-rose-500 text-white' : 'bg-slate-800 text-slate-300'}`;
        });
        if (state.roomState && state.playerRole === 'p1') {
          state.roomState.settings.maxLives = val;
          state.roomState.p1.lives = val;
          if (state.roomState.p2) state.roomState.p2.lives = val;
          broadcastRoomState();
        }
        sfx.pop();
      });
    });

    document.querySelectorAll('.emoji-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const emoji = btn.getAttribute('data-emoji');
        if (!emoji) return;
        spawnFloatingEmoji(emoji);
        sfx.pop();
        if (state.mode === 'online') {
          sendRoomEvent({ type: 'REACTION', emoji });
        }
      });
    });

    // Boot App
    renderPunishmentModalList();
    initMqttBroker();
  </script>
</body>
</html>
