<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#090d16" />
  <title>Sambung Kata Nusantara LDR</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    input, select {
      user-select: text;
    }

    html, body {
      height: 100dvh;
      margin: 0;
      padding: 0;
      background-color: #05080f;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #f8fafc;
      overflow: hidden;
    }

    .font-display {
      font-family: 'Space Grotesk', sans-serif;
    }

    .mobile-shell {
      width: 100%;
      max-width: 430px;
      height: 100dvh;
      margin: 0 auto;
      background: radial-gradient(circle at 50% 0%, #261033 0%, #0b1120 48%, #070b14 100%);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    @media (min-width: 450px) {
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 50%, #151c2e 0%, #04060b 100%);
      }
      .mobile-shell {
        height: min(92dvh, 860px);
        border-radius: 44px;
        border: 6px solid #1e293b;
        box-shadow: 0 30px 70px -15px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(255, 255, 255, 0.08);
      }
    }

    .safe-top {
      padding-top: max(env(safe-area-inset-top), 14px);
    }

    .safe-bottom {
      padding-bottom: max(env(safe-area-inset-bottom), 14px);
    }

    .glass-surface {
      background: rgba(20, 28, 45, 0.72);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .ios-input {
      background: rgba(9, 14, 26, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.18s ease;
    }

    .ios-input:focus {
      outline: none;
      border-color: #fb7185;
      box-shadow: 0 0 0 3px rgba(244, 63, 94, 0.2);
    }

    .tap-btn {
      transition: transform 0.12s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.15s ease;
    }
    .tap-btn:active:not(:disabled) {
      transform: scale(0.95);
    }

    @keyframes floatEmoji {
      0% { transform: translateY(0) scale(0.75); opacity: 1; }
      100% { transform: translateY(-160px) scale(1.4); opacity: 0; }
    }

    .floating-emoji {
      position: absolute;
      pointer-events: none;
      z-index: 60;
      animation: floatEmoji 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes pulseBorder {
      0%, 100% { border-color: rgba(251, 113, 133, 0.45); box-shadow: 0 0 14px rgba(244, 63, 94, 0.25); }
      50% { border-color: rgba(251, 113, 133, 0.95); box-shadow: 0 0 22px rgba(244, 63, 94, 0.55); }
    }

    .turn-active {
      animation: pulseBorder 1.8s infinite;
      background: rgba(244, 63, 94, 0.12);
    }

    @keyframes shakeX {
      0%, 100% { transform: translateX(0); }
      25%, 75% { transform: translateX(-5px); }
      50% { transform: translateX(5px); }
    }

    .shake-anim {
      animation: shakeX 0.3s ease-in-out;
    }

    @keyframes springIn {
      0% { transform: scale(0.94); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .spring-in {
      animation: springIn 0.24s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body>

  <main class="mobile-shell">

    <!-- iOS / Android Top Status & App Header -->
    <header class="safe-top px-5 pb-2 flex items-center justify-between shrink-0 z-20">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-2xl bg-gradient-to-br from-rose-500 to-pink-600 flex items-center justify-center shadow-lg shadow-rose-500/30">
          <svg class="w-4 h-4 text-white" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
        </div>
        <span class="font-display font-extrabold text-base tracking-tight text-white">Sambung Kata</span>
        <span id="conn-dot" class="w-2.5 h-2.5 rounded-full bg-emerald-400 shadow-[0_0_8px_#34d399]" title="Siap"></span>
      </div>

      <div class="flex items-center gap-2">
        <button id="btn-open-punishments" aria-label="Hukuman"
          class="tap-btn h-9 px-3 rounded-full glass-surface flex items-center gap-1.5 text-xs font-bold text-rose-300">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.2" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/>
          </svg>
          <span id="punishment-count-badge">10</span>
        </button>

        <button id="btn-toggle-sound" aria-label="Suara"
          class="tap-btn w-9 h-9 rounded-full glass-surface flex items-center justify-center text-slate-200">
          <svg id="icon-sound-on" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
          </svg>
          <svg id="icon-sound-off" class="w-4 h-4 hidden text-slate-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Toast Pill Overlay -->
    <div id="toast-container" class="absolute top-16 left-4 right-4 z-50 flex flex-col items-center gap-1.5 pointer-events-none"></div>

    <!-- =================================================================== -->
    <!-- VIEW 1: LOBBY                                                       -->
    <!-- =================================================================== -->
    <section id="view-lobby" class="flex-1 flex flex-col justify-between px-5 py-3 overflow-y-auto no-scrollbar spring-in">
      <div class="my-auto space-y-4">
        <!-- Language Pills -->
        <div class="flex items-center justify-center gap-1.5">
          <span class="px-2.5 py-1 rounded-full bg-rose-500/15 border border-rose-500/30 text-[11px] font-bold text-rose-300">ID</span>
          <span class="px-2.5 py-1 rounded-full bg-amber-500/15 border border-amber-500/30 text-[11px] font-bold text-amber-300">JAWA</span>
          <span class="px-2.5 py-1 rounded-full bg-emerald-500/15 border border-emerald-500/30 text-[11px] font-bold text-emerald-300">SUNDA</span>
          <span class="px-2.5 py-1 rounded-full bg-sky-500/15 border border-sky-500/30 text-[11px] font-bold text-sky-300">LOKAL</span>
        </div>

        <!-- Main Card -->
        <div class="glass-surface rounded-3xl p-5 space-y-4">
          <input id="player-name-input" type="text" maxlength="14" placeholder="Nama kamu..."
            class="ios-input w-full px-4 py-3.5 rounded-2xl text-white placeholder-slate-500 font-bold text-base text-center" />

          <button id="btn-create-room" type="button"
            class="tap-btn w-full py-3.5 px-4 rounded-2xl bg-gradient-to-r from-rose-500 to-pink-600 text-white font-extrabold text-sm shadow-lg shadow-rose-500/25 flex items-center justify-center gap-2">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            Buat Room
          </button>

          <div class="flex gap-2">
            <input id="room-code-input" type="text" maxlength="4" placeholder="KODE"
              class="ios-input w-28 px-3 py-3.5 rounded-2xl text-center text-white font-display font-extrabold text-base tracking-[0.2em] uppercase placeholder-slate-600" />
            <button id="btn-join-room" type="button"
              class="tap-btn flex-1 py-3.5 px-4 rounded-2xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white font-bold text-sm">
              Masuk Room
            </button>
          </div>
        </div>
      </div>

      <!-- Bottom Quick Mode Switch -->
      <div class="safe-bottom pt-2">
        <button id="btn-local-mode" type="button"
          class="tap-btn w-full py-3 px-4 rounded-2xl glass-surface text-slate-300 font-bold text-xs flex items-center justify-center gap-2">
          <svg class="w-4 h-4 text-amber-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <rect x="5" y="2" width="14" height="20" rx="3"/><line x1="12" y1="18" x2="12.01" y2="18"/>
          </svg>
          Pass & Play (1 HP)
        </button>
      </div>
    </section>

    <!-- =================================================================== -->
    <!-- VIEW 2: WAITING ROOM                                                -->
    <!-- =================================================================== -->
    <section id="view-waiting" class="hidden flex-1 flex flex-col justify-between px-5 py-3 overflow-y-auto no-scrollbar spring-in">
      <div class="space-y-4 my-auto">
        <!-- Room Code Display -->
        <div class="glass-surface rounded-3xl p-5 text-center space-y-3">
          <div class="flex items-center justify-center gap-2">
            <div id="display-room-code"
              class="font-display text-4xl font-black tracking-[0.25em] bg-slate-950/90 border border-rose-500/40 px-5 py-2.5 rounded-2xl text-rose-300 select-all">
              ----
            </div>
            <button id="btn-copy-code" type="button" aria-label="Salin"
              class="tap-btn p-3.5 rounded-2xl bg-slate-800 border border-slate-700 text-slate-200">
              <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
              </svg>
            </button>
          </div>

          <!-- 2 Players Slots -->
          <div class="grid grid-cols-2 gap-2.5 pt-1">
            <div class="bg-slate-950/70 border border-rose-500/30 rounded-2xl p-3 text-center">
              <span class="text-[10px] font-extrabold uppercase text-rose-400 block">P1</span>
              <span id="wait-p1-name" class="font-bold text-sm text-white truncate block mt-0.5">-</span>
            </div>
            <div class="bg-slate-950/70 border border-slate-800 rounded-2xl p-3 text-center">
              <span class="text-[10px] font-extrabold uppercase text-amber-400 block">P2</span>
              <span id="wait-p2-name" class="font-bold text-sm text-slate-400 truncate block mt-0.5 animate-pulse">...</span>
            </div>
          </div>
          <div id="wait-status-pill" class="text-[11px] font-bold text-emerald-400">Bagikan kode ke pasangan</div>
        </div>

        <!-- Compact Pill Settings -->
        <div class="glass-surface rounded-3xl p-4 space-y-3">
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-slate-400">Waktu</span>
            <div id="timer-pills" class="flex gap-1.5">
              <button type="button" data-val="10" class="pill-timer px-2.5 py-1 rounded-xl text-xs font-extrabold bg-slate-800 text-slate-300">10d</button>
              <button type="button" data-val="15" class="pill-timer px-2.5 py-1 rounded-xl text-xs font-extrabold bg-rose-500 text-white">15d</button>
              <button type="button" data-val="20" class="pill-timer px-2.5 py-1 rounded-xl text-xs font-extrabold bg-slate-800 text-slate-300">20d</button>
              <button type="button" data-val="30" class="pill-timer px-2.5 py-1 rounded-xl text-xs font-extrabold bg-slate-800 text-slate-300">30d</button>
            </div>
          </div>

          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-slate-400">Nyawa</span>
            <div id="lives-pills" class="flex gap-1.5">
              <button type="button" data-val="3" class="pill-lives px-3 py-1 rounded-xl text-xs font-extrabold bg-rose-500 text-white">3 ❤️</button>
              <button type="button" data-val="5" class="pill-lives px-3 py-1 rounded-xl text-xs font-extrabold bg-slate-800 text-slate-300">5 ❤️</button>
            </div>
          </div>

          <input id="setting-custom-starter" type="text" maxlength="18" placeholder="Kata awal (opsional)"
            class="ios-input w-full px-3.5 py-2.5 rounded-xl text-xs font-bold text-white placeholder-slate-500 text-center" />
        </div>
      </div>

      <!-- Bottom Action Buttons -->
      <div class="safe-bottom flex gap-2.5 pt-2">
        <button id="btn-leave-waiting" type="button"
          class="tap-btn px-4 py-3.5 rounded-2xl bg-slate-800 text-slate-300 font-bold text-sm">
          Batal
        </button>
        <button id="btn-start-game" type="button" disabled
          class="tap-btn flex-1 py-3.5 rounded-2xl bg-gradient-to-r from-rose-500 to-pink-600 disabled:opacity-40 text-white font-extrabold text-sm shadow-lg shadow-rose-500/25">
          Menunggu P2...
        </button>
      </div>
    </section>

    <!-- =================================================================== -->
    <!-- VIEW 3: IN-GAME ARENA                                               -->
    <!-- =================================================================== -->
    <section id="view-game" class="hidden flex-1 flex flex-col justify-between px-4 pt-1 overflow-hidden spring-in">

      <!-- Top Players & Lives Bar -->
      <div class="grid grid-cols-2 gap-2.5 shrink-0">
        <div id="card-p1" class="glass-surface rounded-2xl p-2.5 border transition-all">
          <div class="flex items-center justify-between">
            <span id="game-p1-name" class="font-bold text-xs truncate text-rose-200 max-w-[90px]">P1</span>
            <span class="font-display font-bold text-xs text-slate-400" id="game-p1-score">0</span>
          </div>
          <div id="game-p1-lives" class="text-xs mt-1 tracking-tighter">❤️❤️❤️</div>
        </div>

        <div id="card-p2" class="glass-surface rounded-2xl p-2.5 border transition-all">
          <div class="flex items-center justify-between">
            <span id="game-p2-name" class="font-bold text-xs truncate text-amber-200 max-w-[90px]">P2</span>
            <span class="font-display font-bold text-xs text-slate-400" id="game-p2-score">0</span>
          </div>
          <div id="game-p2-lives" class="text-xs mt-1 tracking-tighter">❤️❤️❤️</div>
        </div>
      </div>

      <!-- Center Stage: Timer + Current Word + History -->
      <div class="flex-1 flex flex-col justify-center gap-3 my-2 min-h-0">
        <div class="glass-surface rounded-3xl p-4 text-center relative overflow-hidden">
          <div class="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden mb-3">
            <div id="timer-bar" class="h-full bg-gradient-to-r from-rose-500 to-amber-400 transition-all duration-150" style="width: 100%;"></div>
          </div>

          <div class="flex items-center justify-between text-[11px] font-bold">
            <span id="last-word-lang-badge" class="px-2 py-0.5 rounded-md bg-emerald-500/15 text-emerald-300 border border-emerald-500/25">ID</span>
            <span class="font-display text-sm text-rose-300"><span id="timer-text">15</span>d</span>
          </div>

          <div id="current-word-display" class="font-display text-3xl sm:text-4xl font-extrabold tracking-wide my-2.5 break-words">
            <span class="text-slate-200">ang</span><span class="text-rose-400 underline decoration-rose-500/70 decoration-4 underline-offset-4">sa</span>
          </div>

          <div class="inline-flex items-center gap-1.5 px-4 py-1 rounded-full bg-rose-500/15 border border-rose-500/40">
            <span id="required-syllable-badge" class="font-display font-black text-rose-300 text-base uppercase tracking-widest">SA</span>
          </div>
        </div>

        <div id="word-history-list" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-1 shrink-0"></div>
      </div>

      <!-- Bottom Docked Controls -->
      <div class="safe-bottom space-y-2 shrink-0">
        <div class="flex items-center justify-between px-1">
          <div class="flex gap-1.5">
            <button type="button" data-emoji="❤️" class="emoji-btn tap-btn w-8 h-8 rounded-full glass-surface text-sm flex items-center justify-center">❤️</button>
            <button type="button" data-emoji="😘" class="emoji-btn tap-btn w-8 h-8 rounded-full glass-surface text-sm flex items-center justify-center">😘</button>
            <button type="button" data-emoji="😂" class="emoji-btn tap-btn w-8 h-8 rounded-full glass-surface text-sm flex items-center justify-center">😂</button>
            <button type="button" data-emoji="🔥" class="emoji-btn tap-btn w-8 h-8 rounded-full glass-surface text-sm flex items-center justify-center">🔥</button>
            <button type="button" data-emoji="🥺" class="emoji-btn tap-btn w-8 h-8 rounded-full glass-surface text-sm flex items-center justify-center">🥺</button>
          </div>
          <button id="btn-quit-game" type="button" aria-label="Keluar"
            class="tap-btn w-8 h-8 rounded-full glass-surface text-slate-400 hover:text-rose-400 flex items-center justify-center">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
          </button>
        </div>

        <form id="word-form" class="flex gap-2">
          <input id="word-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
            placeholder="Ketik kata..."
            class="ios-input flex-1 px-4 py-3.5 rounded-2xl text-white font-bold text-base placeholder-slate-500" />
          <button id="btn-submit-word" type="submit" aria-label="Kirim"
            class="tap-btn w-14 rounded-2xl bg-gradient-to-r from-rose-500 to-pink-600 disabled:opacity-40 text-white font-extrabold shadow-lg shadow-rose-500/25 flex items-center justify-center shrink-0">
            <svg id="submit-btn-icon" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
            <span id="submit-btn-spinner" class="hidden w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
          </button>
        </form>
      </div>
    </section>

    <!-- =================================================================== -->
    <!-- VIEW 4: GAME OVER & LDR PUNISHMENT CARD                             -->
    <!-- =================================================================== -->
    <section id="view-gameover" class="hidden flex-1 flex flex-col justify-between px-5 py-3 overflow-y-auto no-scrollbar spring-in">
      <div class="my-auto space-y-4 text-center">
        <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-rose-500/20 border border-rose-500/40 text-rose-300 text-xs font-extrabold">
          <span>💔</span>
          <span id="loser-name-display">Pemain</span>
          <span>•</span>
          <span id="summary-total-words">0 Kata</span>
        </div>

        <div class="bg-gradient-to-br from-rose-950/90 via-slate-900 to-amber-950/75 border border-rose-500/45 rounded-3xl p-6 shadow-2xl space-y-3">
          <div class="w-11 h-11 rounded-2xl bg-amber-500/20 border border-amber-500/40 text-amber-300 flex items-center justify-center mx-auto text-xl">
            🎲
          </div>
          <p id="punishment-result-text" class="text-base font-extrabold text-white leading-snug min-h-[3.5rem] flex items-center justify-center">
            -
          </p>
        </div>
      </div>

      <div class="safe-bottom space-y-2.5 pt-2">
        <div class="flex gap-2.5">
          <button id="btn-reroll-punishment" type="button"
            class="tap-btn flex-1 py-3.5 rounded-2xl bg-amber-500/20 border border-amber-500/40 text-amber-200 font-bold text-xs flex items-center justify-center gap-1.5">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
              <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
            </svg>
            Acak Lagi
          </button>
          <button id="btn-back-lobby" type="button"
            class="tap-btn px-5 py-3.5 rounded-2xl bg-slate-800 text-slate-300 font-bold text-xs">
            Lobi
          </button>
        </div>

        <button id="btn-play-again" type="button"
          class="tap-btn w-full py-3.5 rounded-2xl bg-gradient-to-r from-rose-500 to-pink-600 text-white font-extrabold text-sm shadow-lg shadow-rose-500/25">
          Main Lagi ❤️
        </button>
      </div>
    </section>

    <!-- =================================================================== -->
    <!-- BOTTOM SHEET MODAL: CUSTOM PUNISHMENTS                              -->
    <!-- =================================================================== -->
    <div id="modal-punishments" class="hidden absolute inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex flex-col justify-end">
      <div class="glass-surface rounded-t-3xl p-5 space-y-3.5 max-h-[78%] flex flex-col border-t border-white/15 safe-bottom spring-in">
        <div class="w-10 h-1 bg-slate-600 rounded-full mx-auto"></div>
        <div class="flex items-center justify-between">

      'https://gun-manhattan.herokuapp.com/gun',
      'https://peer.wallie.io/gun',
      'https://gundb-relay-mlqc.onrender.com/gun',
      'https://relay.peer.ooo/gun'
    ];
    const ROOM_NS = 'ldr_sambung_kata_nusantara_v4_';

    let gunInstance = null;
    let activeRoomNode = null;
    let clientSessionId = Math.random().toString(36).slice(2, 10);
    let lastProcessedEventId = '';
    let heartbeatTimer = null;

    function getGun() {
      if (!gunInstance && typeof Gun !== 'undefined') {
        gunInstance = Gun({ peers: GUN_PEERS, localStorage: false });
      }
      return gunInstance;
    }

    function setConnectionDot(status) {
      const dot = document.getElementById('conn-dot');
      if (!dot) return;
      dot.className = 'w-2.5 h-2.5 rounded-full transition-colors ';
      if (status === 'connected') {
        dot.className += 'bg-emerald-400 shadow-[0_0_8px_#34d399]';
      } else if (status === 'connecting') {
        dot.className += 'bg-amber-400 animate-ping';
      } else {
        dot.className += 'bg-rose-500';
      }
    }

    function cleanupMultiplayer() {
      if (heartbeatTimer) {
        clearInterval(heartbeatTimer);
        heartbeatTimer = null;
      }
      if (activeRoomNode) {
        try { activeRoomNode.off(); } catch (e) {}
        activeRoomNode = null;
      }
      lastProcessedEventId = '';
      setConnectionDot('connected');
    }

    function subscribeToRoom(code) {
      const gun = getGun();
      if (!gun) return;
      if (activeRoomNode) {
        try { activeRoomNode.off(); } catch (e) {}
      }
      activeRoomNode = gun.get(ROOM_NS + code);

      activeRoomNode.get('state').on((rawStr) => {
        if (!rawStr || typeof rawStr !== 'string') return;
        try {
          const incoming = JSON.parse(rawStr);
          if (!incoming || !incoming.roomCode) return;
          if (incoming._sender === clientSessionId) return;
          syncUIWithRoomState(incoming);
        } catch (e) {}
      });

      activeRoomNode.get('event').on((rawEvt) => {
        if (!rawEvt || typeof rawEvt !== 'string') return;
        try {
          const evt = JSON.parse(rawEvt);
          if (!evt || !evt.id || evt.id === lastProcessedEventId) return;
          if (evt.sender === clientSessionId) return;
          lastProcessedEventId = evt.id;

          if (evt.type === 'JOIN_REQUEST' && state.playerRole === 'p1' && state.roomState) {
            state.roomState = {
              ...state.roomState,
              p2: {
                name: evt.playerName || 'Pasangan',
                lives: state.selectedLives,
                score: 0
              }
            };
            sfx.success();
            showToast(`${state.roomState.p2.name} bergabung!`, 'success');
            broadcastRoomState();
          } else if (evt.type === 'REACTION' && evt.emoji) {
            spawnFloatingEmoji(evt.emoji);
            sfx.pop();
          } else if (evt.type === 'PLAYER_LEFT') {
            showToast('Pasangan keluar dari room', 'error');
            sfx.error();
            if (state.playerRole === 'p1' && state.roomState) {
              state.roomState = { ...state.roomState, status: 'waiting', p2: null };
              broadcastRoomState();
            } else {
              resetToLobby(false);
            }
          }
        } catch (e) {}
      });
    }

    function sendRoomEvent(payload) {
      if (!activeRoomNode) return;
      const evt = {
        ...payload,
        id: `${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
        sender: clientSessionId
      };
      activeRoomNode.get('event').put(JSON.stringify(evt));
    }

    function broadcastRoomState() {
      if (!state.roomState) return;
      syncUIWithRoomState(state.roomState);
      if (activeRoomNode) {
        const packet = {
          ...state.roomState,
          _sender: clientSessionId,
          _ts: Date.now()
        };
        activeRoomNode.get('state').put(JSON.stringify(packet));
      }
    }

      setConnectionDot('connected');

      broadcastRoomState();

      const codeInput = document.getElementById('room-code-input');
      const code = codeInput.value.trim().toUpperCase();
      if (code.length !== 4) {

      const btn = document.getElementById('btn-join-room');

      setConnectionDot('connecting');

      const p2Name = document.getElementById('player-name-input').value.trim() || 'P2';

      state.mode = 'online';
      state.roomCode = code;
      state.playerRole = 'p2';
      state.roomState = null;

      subscribeToRoom(code);
      sendRoomEvent({ type: 'JOIN_REQUEST', playerName: p2Name });

        if (state.roomState && state.roomState.roomCode === code) {
          clearInterval(retryTimer);
          btn.disabled = false;
          btn.textContent = 'Masuk Room';
          setConnectionDot('connected');
        } else {
          sendRoomEvent({ type: 'JOIN_REQUEST', playerName: p2Name });
        }
      }, 1500);

      setTimeout(() => {
        clearInterval(retryTimer);
        btn.disabled = false;
        btn.textContent = 'Masuk Room';
        if (!state.roomState) {

          state.mode = null;
          state.roomCode = null;

    }

    function splitIndonesianSyllables(word) {
      const clean = word.toLowerCase().replace(/[^a-z]/g, '');
      if (!clean) return [];
      const tokenized = clean
        .replace(/ng/g, '1')
        .replace(/ny/g, '2')
        .replace(/kh/g, '3')
        .replace(/sy/g, '4');

      const vowels = new Set(['a', 'i', 'u', 'e', 'o']);
      const syllables = [];
      let current = '';

      for (let i = 0; i < tokenized.length; i++) {
        const ch = tokenized[i];
        current += ch;
        if (vowels.has(ch)) {
          let consonantsAhead = 0;
          let j = i + 1;
          while (j < tokenized.length && !vowels.has(tokenized[j])) {
            consonantsAhead++;
            j++;
          }
          if (j === tokenized.length) {
            current += tokenized.slice(i + 1);
            syllables.push(current);
            break;
          } else if (consonantsAhead === 0) {
            syllables.push(current);
            current = '';
          } else if (consonantsAhead === 1) {
            syllables.push(current);
            current = '';
          } else {
            current += tokenized[i + 1];
            i++;
            syllables.push(current);
            current = '';
          }
        }
      }

      if (current && syllables.length === 0) syllables.push(current);
      else if (current) syllables[syllables.length - 1] += current;

      return syllables.map(s =>
        s.replace(/1/g, 'ng')
         .replace(/2/g, 'ny')
         .replace(/3/g, 'kh')
         .replace(/4/g, 'sy')
      );
    }

    function getLastSyllable(word) {
      const sylls = splitIndonesianSyllables(word);
      if (sylls.length === 0) return word.slice(-2).toLowerCase();
      return sylls[sylls.length - 1].toLowerCase();
    }

    async function validateNusantaraWord(rawWord) {
      const word = rawWord.toLowerCase().replace(/[^a-z]/g, '');
      if (word.length < 2) return { valid: false, reason: 'Terlalu pendek' };
      if (FOREIGN_BLOCKLIST.has(word)) return { valid: false, reason: 'Kata bahasa asing!' };
      if (/(.)\1\1/.test(word)) return { valid: false, reason: 'Kata tidak valid' };
      if (!/[aiueo]/.test(word)) return { valid: false, reason: 'Harus mengandung vokal' };

      if (NUSANTARA_LEXICON.has(word)) {
        return { valid: true, label: 'NUSANTARA' };
      }

      const wikis = [
        { url: `https://id.wiktionary.org/w/api.php?action=query&titles=${encodeURIComponent(word)}&format=json&origin=*`, label: 'INDONESIA' },
        { url: `https://jv.wiktionary.org/w/api.php?action=query&titles=${encodeURIComponent(word)}&format=json&origin=*`, label: 'JAWA' },
        { url: `https://su.wiktionary.org/w/api.php?action=query&titles=${encodeURIComponent(word)}&format=json&origin=*`, label: 'SUNDA' }
      ];

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 1400);

        const results = await Promise.allSettled(
          wikis.map(w =>
            fetch(w.url, { signal: controller.signal })
              .then(r => r.json())
              .then(json => {
                const pages = json?.query?.pages || {};
                const pageId = Object.keys(pages)[0];
                if (pageId && pageId !== '-1') return w.label;
                return null;
              })
          )
        );
        clearTimeout(timeoutId);

        for (const res of results) {
          if (res.status === 'fulfilled' && res.value) {
            NUSANTARA_LEXICON.add(word);
            return { valid: true, label: res.value };
          }
        }
      } catch (e) {}

      const hasNusantaraPattern = /^(ng|ny|me|di|ke|se|te|pe|be|pa|pi|ka|sa|ta|ma|na|ba|da|ga|ja|la|ra|wa|ya)/.test(word) ||
        /(an|in|ke|na|ne|ng|ny|ah|ih|uh|eh|oh|at|it|ut|ak|ik|uk)$/.test(word);
      const noForeignClusters = !/(q|x|v|z|sh|th|wh|oo|ee|ck|ght|tion|ing$)/.test(word);

      if (word.length >= 3 && hasNusantaraPattern && noForeignClusters) {
        NUSANTARA_LEXICON.add(word);
        return { valid: true, label: 'LOKAL' };
      }

      return { valid: false, reason: 'Bukan kata Nusantara!' };
    }

    function showView(viewName) {
      ['lobby', 'waiting', 'game', 'gameover'].forEach(v => {
        const el = document.getElementById(`view-${v}`);
        if (el) el.classList.toggle('hidden', v !== viewName);
      });
    }

    function syncUIWithRoomState(data) {
      if (!data) return;
      state.roomState = data;

      if (data.status === 'waiting') {
        stopTurnTimer();
        showView('waiting');
        document.getElementById('display-room-code').textContent = data.roomCode || '----';
        document.getElementById('wait-p1-name').textContent = data.p1?.name || 'P1';
        const p2El = document.getElementById('wait-p2-name');
        const statusPill = document.getElementById('wait-status-pill');
        const startBtn = document.getElementById('btn-start-game');

        if (data.p2) {
          p2El.textContent = data.p2.name;
          p2El.classList.remove('animate-pulse', 'text-slate-400');
          p2El.classList.add('text-white');
          statusPill.textContent = 'Pasangan siap bermain ❤️';
          if (state.playerRole === 'p1') {
            startBtn.disabled = false;
            startBtn.textContent = 'Mulai Main ❤️';
          } else {
            startBtn.disabled = true;
            startBtn.textContent = 'Menunggu P1 mulai...';
          }
        } else {
          p2El.textContent = '...';
          p2El.classList.add('animate-pulse', 'text-slate-400');
          p2El.classList.remove('text-white');
          statusPill.textContent = 'Bagikan kode ke pasangan';
          startBtn.disabled = true;
          startBtn.textContent = 'Menunggu P2...';
        }
      } else if (data.status === 'playing') {
        showView('game');
        renderGameArena(data);
      } else if (data.status === 'gameover') {
        stopTurnTimer();
        showView('gameover');
        renderGameOver(data);
      }
    }

    function renderLives(count) {
      return '❤️'.repeat(Math.max(0, count)) || '💔';
    }

    function renderGameArena(data) {
      document.getElementById('game-p1-name').textContent = data.p1.name;
      document.getElementById('game-p1-score').textContent = data.p1.score;
      document.getElementById('game-p1-lives').textContent = renderLives(data.p1.lives);

      document.getElementById('game-p2-name').textContent = data.p2.name;
      document.getElementById('game-p2-score').textContent = data.p2.score;
      document.getElementById('game-p2-lives').textContent = renderLives(data.p2.lives);

      const cardP1 = document.getElementById('card-p1');
      const cardP2 = document.getElementById('card-p2');
      cardP1.classList.toggle('turn-active', data.turn === 'p1');
      cardP2.classList.toggle('turn-active', data.turn === 'p2');

      const word = data.currentWord || 'angsa';
      const target = data.requiredSyllable || getLastSyllable(word);
      const prefix = word.slice(0, Math.max(0, word.length - target.length));
      const suffix = word.slice(Math.max(0, word.length - target.length));

      document.getElementById('current-word-display').innerHTML =
        `<span class="text-slate-200">${prefix}</span><span class="text-rose-400 underline decoration-rose-500/70 decoration-4 underline-offset-4">${suffix}</span>`;
      document.getElementById('required-syllable-badge').textContent = target.toUpperCase();
      document.getElementById('last-word-lang-badge').textContent = data.lastWordLabel || 'NUSANTARA';

      const historyEl = document.getElementById('word-history-list');
      const recent = (data.usedWords || []).slice(-8);
      historyEl.innerHTML = recent.map((w, idx) => {
        const isLast = idx === recent.length - 1;
        return `<span class="px-2.5 py-1 rounded-full text-[11px] font-bold shrink-0 ${isLast ? 'bg-rose-500/25 border border-rose-500/50 text-rose-200' : 'bg-slate-800/80 text-slate-400'}">${w}</span>`;
      }).join('');
      historyEl.scrollLeft = historyEl.scrollWidth;

      const isMyTurn = state.mode === 'local' || data.turn === state.playerRole;
      const inputEl = document.getElementById('word-input');
      const submitBtn = document.getElementById('btn-submit-word');

      inputEl.disabled = !isMyTurn;
      submitBtn.disabled = !isMyTurn;

      if (isMyTurn) {
        const activeName = data.turn === 'p1' ? data.p1.name : data.p2.name;
        inputEl.placeholder = state.mode === 'local'
          ? `Giliran ${activeName}: awalan "${target.toUpperCase()}"...`
          : `Awalan "${target.toUpperCase()}"...`;
        inputEl.focus();
      } else {
        const waitName = data.turn === 'p1' ? data.p1.name : data.p2.name;
        inputEl.value = '';
        inputEl.placeholder = `Giliran ${waitName}...`;
      }

      startTurnTimer(data);
    }

    function stopTurnTimer() {
      if (state.timerInterval) {
        clearInterval(state.timerInterval);
        state.timerInterval = null;
      }
    }

    function startTurnTimer(data) {
      stopTurnTimer();
      const duration = data.settings?.turnDuration || 15;
      const timerText = document.getElementById('timer-text');
      const timerBar = document.getElementById('timer-bar');
      let lastWholeSec = duration;

      state.timerInterval = setInterval(() => {
        if (!state.roomState || state.roomState.status !== 'playing' || state.isValidating) return;

        const elapsed = (Date.now() - state.roomState.turnStartedAt) / 1000;
        const remaining = Math.max(0, duration - elapsed);
        const wholeSec = Math.ceil(remaining);

        timerText.textContent = wholeSec;
        timerBar.style.width = `${(remaining / duration) * 100}%`;

        if (wholeSec <= 5 && wholeSec > 0 && wholeSec !== lastWholeSec) {
          sfx.tick();
        }
        lastWholeSec = wholeSec;

        if (remaining <= 0) {
          stopTurnTimer();
          const isResponsible = state.mode === 'local' || state.roomState.turn === state.playerRole;
          if (isResponsible) {
            handleTurnTimeout();
          }
        }
      }, 150);
    }

    function handleTurnTimeout() {
      const data = state.roomState;
      if (!data || data.status !== 'playing') return;

      sfx.error();
      const currentKey = data.turn;
      const otherKey = currentKey === 'p1' ? 'p2' : 'p1';
      const currentPlayer = data[currentKey];
      const newLives = currentPlayer.lives - 1;

      showToast(`Waktu habis! ${currentPlayer.name} -1 ❤️`, 'error');

      const updatedPlayer = { ...currentPlayer, lives: newLives };

      if (newLives <= 0) {
        const pool = data.punishmentsPool && data.punishmentsPool.length > 0 ? data.punishmentsPool : punishmentsList;
        const chosenPunishment = pool[Math.floor(Math.random() * pool.length)];
        state.roomState = {
          ...data,
          [currentKey]: updatedPlayer,
          status: 'gameover',
          loser: currentPlayer.name,
          winner: data[otherKey].name,
          punishment: chosenPunishment
        };

        if (state.mode === 'local') {
          showView('gameover');
          renderGameOver(state.roomState);
        } else {
          broadcastRoomState();
        }
      } else {
        state.roomState = {
          ...data,
          [currentKey]: updatedPlayer,
          turn: otherKey,
          round: data.round + 1,
          turnStartedAt: Date.now()
        };

        if (state.mode === 'local') {
          renderGameArena(state.roomState);
        } else {
          broadcastRoomState();
        }
      }
    }

    function startLocalMode() {
      cleanupMultiplayer();
      const p1Name = document.getElementById('player-name-input').value.trim() || 'P1';
      const starter = getRandomStarterWord();

      state.mode = 'local';
      state.roomCode = 'LOCAL';
      state.playerRole = 'p1';
      state.roomState = {
        roomCode: 'LOCAL',
        status: 'playing',
        settings: { turnDuration: state.selectedTimer, maxLives: state.selectedLives, customStarter: '' },
        p1: { name: p1Name, lives: state.selectedLives, score: 0 },
        p2: { name: 'Pasangan', lives: state.selectedLives, score: 0 },
        turn: 'p1',
        currentWord: starter,
        lastWordLabel: 'NUSANTARA',
        requiredSyllable: getLastSyllable(starter),
        usedWords: [starter],
        round: 1,
        turnStartedAt: Date.now(),
        loser: null,
        winner: null,
        punishment: '',
        punishmentsPool: punishmentsList
      };

      sfx.success();
      showView('game');
      renderGameArena(state.roomState);
    }

    // =========================================================================
    // 4. EVENT LISTENERS & INITIALIZATION
    // =========================================================================
    document.getElementById('word-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = state.roomState;
      if (!data || data.status !== 'playing' || state.isValidating) return;

      const isMyTurn = state.mode === 'local' || data.turn === state.playerRole;
      if (!isMyTurn) return;

      const inputEl = document.getElementById('word-input');
      const raw = inputEl.value.trim().toLowerCase().replace(/[^a-z]/g, '');
      if (!raw) return;

      const target = data.requiredSyllable.toLowerCase();
      if (!raw.startsWith(target)) {
        sfx.error();
        inputEl.classList.add('shake-anim');
        setTimeout(() => inputEl.classList.remove('shake-anim'), 320);
        showToast(`Harus diawali "${target.toUpperCase()}"!`, 'error');
        return;
      }

      if (raw === target) {
        sfx.error();
        showToast('Kata harus lebih panjang dari suku kata!', 'error');
        return;
      }

      if ((data.usedWords || []).includes(raw)) {
        sfx.error();
        inputEl.classList.add('shake-anim');
        setTimeout(() => inputEl.classList.remove('shake-anim'), 320);
        showToast(`"${raw.toUpperCase()}" sudah dipakai!`, 'error');
        return;
      }

      state.isValidating = true;
      document.getElementById('submit-btn-icon').classList.add('hidden');
      document.getElementById('submit-btn-spinner').classList.remove('hidden');

      const check = await validateNusantaraWord(raw);

      state.isValidating = false;
      document.getElementById('submit-btn-icon').classList.remove('hidden');
      document.getElementById('submit-btn-spinner').classList.add('hidden');

      if (!check.valid) {
        sfx.error();
        inputEl.classList.add('shake-anim');
        setTimeout(() => inputEl.classList.remove('shake-anim'), 320);
        showToast(check.reason || 'Kata tidak terdaftar!', 'error');
        return;
      }

      sfx.success();
      inputEl.value = '';

      const currentKey = data.turn;
      const otherKey = currentKey === 'p1' ? 'p2' : 'p1';
      const nextSyllable = getLastSyllable(raw);

      state.roomState = {
        ...data,
        [currentKey]: {
          ...data[currentKey],
          score: data[currentKey].score + 1
        },
        turn: otherKey,
        currentWord: raw,
        lastWordLabel: check.label,
        requiredSyllable: nextSyllable,
        usedWords: [...(data.usedWords || []), raw],
        round: data.round + 1,
        turnStartedAt: Date.now()
      };

      if (state.mode === 'local') {
        renderGameArena(state.roomState);
      } else {
        broadcastRoomState();
      }
    });

    function renderPunishmentModalList() {
      document.getElementById('punishment-count-badge').textContent = punishmentsList.length;
      const ul = document.getElementById('punishment-list-ul');
      ul.innerHTML = punishmentsList.map((item, idx) => `
        <li class="flex items-center justify-between gap-2 bg-slate-900/90 border border-slate-800 px-3 py-2.5 rounded-xl">
          <span class="text-slate-200 leading-snug">${item}</span>
          ${punishmentsList.length > 1 ? `
            <button type="button" data-idx="${idx}" class="btn-del-punishment shrink-0 w-6 h-6 rounded-lg bg-rose-500/20 text-rose-300 font-bold flex items-center justify-center">✕</button>
          ` : ''}
        </li>
      `).join('');

      ul.querySelectorAll('.btn-del-punishment').forEach(btn => {
        btn.addEventListener('click', () => {
          const i = Number(btn.dataset.idx);
          punishmentsList.splice(i, 1);
          savePunishmentsList();
          renderPunishmentModalList();
          sfx.pop();
        });
      });
    }

    document.getElementById('btn-open-punishments').addEventListener('click', () => {
      sfx.pop();
      renderPunishmentModalList();
      document.getElementById('modal-punishments').classList.remove('hidden');
    });

    document.getElementById('btn-close-modal').addEventListener('click', () => {
      sfx.pop();
      document.getElementById('modal-punishments').classList.add('hidden');
    });

    document.getElementById('btn-add-punishment').addEventListener('click', () => {
      const inp = document.getElementById('new-punishment-input');
      const val = inp.value.trim();
      if (!val) return;
      punishmentsList.unshift(val);
      savePunishmentsList();
      inp.value = '';
      renderPunishmentModalList();
      sfx.success();
    });

    document.querySelectorAll('.pill-timer').forEach(btn => {
      btn.addEventListener('click', () => {
        sfx.pop();
        state.selectedTimer = Number(btn.dataset.val);
        document.querySelectorAll('.pill-timer').forEach(b => {
          const active = Number(b.dataset.val) === state.selectedTimer;
          b.className = `pill-timer px-2.5 py-1 rounded-xl text-xs font-extrabold ${active ? 'bg-rose-500 text-white' : 'bg-slate-800 text-slate-300'}`;
        });
      });
    });

    document.querySelectorAll('.pill-lives').forEach(btn => {
      btn.addEventListener('click', () => {
        sfx.pop();
        state.selectedLives = Number(btn.dataset.val);
        document.querySelectorAll('.pill-lives').forEach(b => {
          const active = Number(b.dataset.val) === state.selectedLives;
          b.className = `pill-lives px-3 py-1 rounded-xl text-xs font-extrabold ${active ? 'bg-rose-500 text-white' : 'bg-slate-800 text-slate-300'}`;
        });
      });
    });

    document.getElementById('btn-toggle-sound').addEventListener('click', () => {
      state.soundEnabled = !state.soundEnabled;
      document.getElementById('icon-sound-on').classList.toggle('hidden', !state.soundEnabled);
      document.getElementById('icon-sound-off').classList.toggle('hidden', state.soundEnabled);
      if (state.soundEnabled) sfx.pop();
    });

    function renderGameOver(data) {
      sfx.gameover();
      document.getElementById('loser-name-display').textContent = data.loser || 'Pemain';
      document.getElementById('summary-total-words').textContent = `${data.usedWords?.length || 0} Kata`;
      document.getElementById('punishment-result-text').textContent = data.punishment || punishmentsList[0];
    }

    document.getElementById('btn-reroll-punishment').addEventListener('click', () => {
      sfx.pop();
      const randomPunishment = punishmentsList[Math.floor(Math.random() * punishmentsList.length)];
      if (!state.roomState) return;
      state.roomState.punishment = randomPunishment;
      document.getElementById('punishment-result-text').textContent = randomPunishment;
      if (state.mode === 'online') {
        broadcastRoomState();
      }
    });

    document.getElementById('btn-play-again').addEventListener('click', () => {
      sfx.success();
      if (state.mode === 'local') {
        startLocalMode();
      } else if (state.mode === 'online' && state.roomState) {
        const maxLives = state.roomState.settings?.maxLives || 3;
        const starter = getRandomStarterWord();
        state.roomState = {
          ...state.roomState,
          status: 'playing',
          p1: { ...state.roomState.p1, lives: maxLives, score: 0 },
          p2: { ...state.roomState.p2, lives: maxLives, score: 0 },
          turn: 'p1',
          currentWord: starter,
          lastWordLabel: 'NUSANTARA',
          requiredSyllable: getLastSyllable(starter),
          usedWords: [starter],
          round: 1,
          turnStartedAt: Date.now(),
          loser: null,
          winner: null,
          punishment: ''
        };
        broadcastRoomState();
      }
    });

    document.getElementById('btn-create-room').addEventListener('click', createOnlineRoom);
    document.getElementById('btn-join-room').addEventListener('click', joinOnlineRoom);
    document.getElementById('btn-local-mode').addEventListener('click', startLocalMode);

    document.getElementById('btn-copy-code').addEventListener('click', () => {
      const code = document.getElementById('display-room-code').textContent.trim();
      const temp = document.createElement('input');
      temp.value = code;
      document.body.appendChild(temp);
      temp.select();
      document.execCommand('copy');
      document.body.removeChild(temp);
      sfx.pop();
      showToast(`Kode ${code} disalin`, 'success');
    });

    document.getElementById('btn-start-game').addEventListener('click', async () => {
      if (state.mode === 'online' && state.roomState && state.playerRole === 'p1') {
        const customInput = document.getElementById('setting-custom-starter').value.trim().toLowerCase().replace(/[^a-z]/g, '');
        let starter = getRandomStarterWord();

        if (customInput.length >= 3) {
          const check = await validateNusantaraWord(customInput);
          if (!check.valid) {
            showToast('Kata awal tidak valid', 'error');
            sfx.error();
            return;
          }
          starter = customInput;
        }

        sfx.success();
        state.roomState = {
          ...state.roomState,
          status: 'playing',
          settings: {
            ...state.roomState.settings,
            maxLives: state.selectedLives,
            turnDuration: state.selectedTimer
          },
          p1: { ...state.roomState.p1, lives: state.selectedLives, score: 0 },
          p2: { ...state.roomState.p2, lives: state.selectedLives, score: 0 },
          currentWord: starter,
          lastWordLabel: 'NUSANTARA',
          requiredSyllable: getLastSyllable(starter),
          usedWords: [starter],
          turnStartedAt: Date.now(),
          punishmentsPool: punishmentsList
        };
        broadcastRoomState();
      }
    });

    document.querySelectorAll('.emoji-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const emoji = btn.dataset.emoji;
        spawnFloatingEmoji(emoji);
        sfx.pop();
        if (state.mode === 'online') {
          sendRoomEvent({ type: 'REACTION', emoji });
        }
      });
    });

    function resetToLobby(notify = true) {
      if (notify && state.mode === 'online') {
        sendRoomEvent({ type: 'PLAYER_LEFT' });
      }
      stopTurnTimer();
      cleanupMultiplayer();
      state.mode = null;
      state.roomCode = null;
      state.playerRole = null;
      state.roomState = null;
      showView('lobby');
    }

    getGun();
    document.getElementById('btn-leave-waiting').addEventListener('click', () => resetToLobby(true));
    document.getElementById('btn-quit-game').addEventListener('click', () => resetToLobby(true));
    document.getElementById('btn-back-lobby').addEventListener('click', () => resetToLobby(true));

    renderPunishmentModalList();
  </script>
</body>
</html>
